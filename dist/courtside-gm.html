  }
  function marketSalary(p) {
    const e = S.econ;
    const f = clamp((talent(p) - 50) / 44, 0, 1);
    return clamp(e.min + (e.max - e.min) * Math.pow(f, 2.1), e.min, e.max);
  }
  function askingContract(p) {
    const sal = Math.round(marketSalary(p) * (0.95 + rnd() * 0.15) / 5000) * 5000;
    const yrs = p.age >= 32 ? 1 : p.age >= 29 ? 1 + Math.floor(rnd() * 2) : 2 + Math.floor(rnd() * 3);
    return { sal: clamp(sal, S.econ.min, S.econ.max), yrs };
  }
  // Trade value of a player to a given team (rebuilding teams prize youth).
  function playerValue(p, forTeam) {
    const mode = forTeam ? teamMode(forTeam) : "neutral";
    let t = mode === "rebuild" ? talent(p) + (p.age <= 24 ? 3 : 0) - (p.age >= 29 ? (p.age - 28) * 2 : 0)
      : mode === "contend" ? p.r.ovr * 0.75 + talent(p) * 0.25 : talent(p);
    let v = Math.pow(Math.max(0, t - 44), 2.2) / 12;
    // Contract surplus: underpaid players are worth more.
    const yrs = Math.max(1, p.c.yrs);
    v += ((marketSalary(p) - p.c.sal) / 100000) * Math.min(yrs, 3) * 0.8;
    if (p.inj > 10) v *= 0.85;
    return Math.max(0, v);
  }
  function pickValue(pk, forTeam) {
    const mode = forTeam ? teamMode(forTeam) : "neutral";
    const proj = projectedRank(pk.orig); // 1 = best team
    const n = S.teams.length;
    const slot = (n - proj + 1) + (pk.round - 1) * n; // approx draft slot
    let v = pk.round === 1 ? 4 + 26 * Math.pow((n - slot + 1) / n, 1.6) : pk.round === 2 ? 2.5 : 0.6;
    if (pk.season > S.season) v *= 0.9;
    if (mode === "rebuild") v *= 1.35; else if (mode === "contend") v *= 0.75;
    return v;
  }
  function teamRating(tid) {
    const rot = rotation(tid, true);
    if (!rot.length) return 40;
    return sum(rot.map((x) => P(x.id).r.ovr * x.min)) / sum(rot.map((x) => x.min));
  }
  let rankCache = null;
  function powerRanks() {
    if (rankCache && rankCache.key === S.day + S.phase + S.season) return rankCache.map;
    const arr = S.teams.map((t) => {
      const gp = t.w + t.l;
      const rec = gp ? (t.w / gp - 0.5) * 30 : 0;
      return { id: t.id, score: teamRating(t.id) + rec * Math.min(1, gp / 20) };
    }).sort((a, b) => b.score - a.score);
    const map = {}; arr.forEach((x, i) => (map[x.id] = i + 1));
    rankCache = { key: S.day + S.phase + S.season, map };
    return map;
  }
  const projectedRank = (tid) => powerRanks()[tid];
  function teamMode(tid) {
    const r = projectedRank(tid);
    return r <= 5 ? "contend" : r >= 11 ? "rebuild" : "neutral";
  }

  // ---------- rotation & minutes ----------
  function rotation(tid, ignoreInj) {
    const t = T(tid);
    let ps = roster(tid).filter((p) => ignoreInj || p.inj === 0);
    let order;
    if (t.rotation && tid === S.userTeam) {
      const ids = new Set(ps.map((p) => p.id));
      order = t.rotation.filter((id) => ids.has(id)).map(P);
      for (const p of ps.sort((a, b) => b.r.ovr - a.r.ovr)) if (!order.includes(p)) order.push(p);
    } else order = ps.sort((a, b) => b.r.ovr - a.r.ovr);
    const n = Math.min(order.length, MIN_TEMPLATE.length);
    const mins = MIN_TEMPLATE.slice(0, n);
    const deficit = 200 - sum(mins);
    if (deficit > 0 && n) for (let i = 0; i < n; i++) mins[i] += deficit / n;
    return order.slice(0, n).map((p, i) => ({ id: p.id, min: mins[i], start: i < 5 }));
  }
  function setRotation(order) { T(S.userTeam).rotation = order.slice(); save(); emit(); }

  // ---------- schedule ----------
  function makeSchedule() {
    const ids = shuffle(S.teams.map((t) => t.id));
    const n = ids.length; // 15
    const arr = ids.concat(n % 2 ? [null] : []);
    const m = arr.length;
    const rounds = [];
    let a = arr.slice();
    for (let r = 0; r < m - 1; r++) {
      const games = [];
      for (let i = 0; i < m / 2; i++) { const x = a[i], y = a[m - 1 - i]; if (x && y) games.push([x, y]); }
      rounds.push(games);
      a = [a[0], a[m - 1], ...a.slice(1, m - 1)];
    }
    let days = [];
    for (let cyc = 0; cyc < 3; cyc++) for (const g of rounds) days.push(g.map(([x, y]) => (cyc % 2 ? [y, x] : [x, y])));
    // Extra games: a random cycle through all teams gives each team 2 more games.
    const target = S.sim.games || 44;
    const extraPer = target - 3 * (n - 1);
    if (extraPer > 0) {
      for (let e = 0; e < Math.floor(extraPer / 2); e++) {
        const cyc = shuffle(ids.slice());
        const edges = cyc.map((x, i) => [x, cyc[(i + 1) % n]]);
        // split the cycle into matchings
        const d1 = [], d2 = [], d3 = [];
        edges.forEach((ed, i) => (i === n - 1 && n % 2 ? d3 : i % 2 ? d2 : d1).push(ed));
        days.push(d1, d2); if (d3.length) days.push(d3);
      }
    }
    days = shuffle(days);
    // Randomize home/away within each game.
    const sched = [];
    let gid = 1;
    days.forEach((games, d) => games.forEach(([x, y]) => {
      const flip = rnd() < 0.5;
      sched.push({ gid: gid++, day: d + 1, home: flip ? x : y, away: flip ? y : x, played: false });
    }));
    return sched;
  }
  const lastDay = () => Math.max(...S.schedule.map((g) => g.day));

  // ---------- game simulation ----------
  function simGame(homeId, awayId, opts = {}) {
    const k = S.sim.marginPerRating, home = opts.neutral ? 0 : S.sim.homeAdv;
    const rh = rotation(homeId), ra = rotation(awayId);
    const trh = rh.length ? sum(rh.map((x) => P(x.id).r.ovr * x.min)) / 200 : 40;
    const tra = ra.length ? sum(ra.map((x) => P(x.id).r.ovr * x.min)) / 200 : 40;
    const base = S.sim.leaguePts;
    const margin = (trh - tra) * k + home;
    let hs = Math.round(base + margin / 2 + randn() * 8.6);
    let as = Math.round(base - margin / 2 + randn() * 8.6);
    let ot = 0;
    while (hs === as) { ot++; hs += Math.round(9 + randn() * 3.5 + (trh - tra) * 0.15); as += Math.round(9 + randn() * 3.5); }
    const box = { gid: opts.gid, home: homeId, away: awayId, hs, as, ot, players: {} };
    box.players[homeId] = distributeBox(rh, hs, as, ot);
    box.players[awayId] = distributeBox(ra, as, hs, ot);
    return box;
  }

  function distributeBox(rot, pts, oppPts, ot) {
    const extra = ot * 5;
    const ps = rot.map((x) => ({ p: P(x.id), min: x.min * (1 + extra / 200) * (0.88 + rnd() * 0.24), start: x.start }));
    const totMin = sum(ps.map((x) => x.min));
    ps.forEach((x) => (x.min = (x.min * (200 + extra)) / totMin));
    const lw = () => Math.exp(randn() * 0.33);
    const alloc = (total, wfn) => {
      const w = ps.map((x) => x.min * wfn(x.p) * lw());
      const W = sum(w) || 1;
      const raw = w.map((v) => (v / W) * total);
      const out = raw.map(Math.floor);
      let rem = Math.round(total) - sum(out);
      const order = raw.map((v, i) => [v - out[i], i]).sort((a, b) => b[0] - a[0]);
      for (let i = 0; rem > 0 && i < order.length; i++, rem--) out[order[i][1]]++;
      return out;
    };
    const off = (p) => 0.45 * p.r.ins + 0.35 * p.r.thr + 0.2 * p.r.ovr;
    const ptsA = alloc(pts, (p) => Math.exp((off(p) - 55) / 26));
    const lines = ps.map((x, i) => {
      const p = x.p, pt = ptsA[i];
      const f3 = clamp(0.05 + (p.r.thr - 35) * 0.009, 0, 0.55);
      const fft = clamp(0.13 + (p.r.ath - 50) * 0.003 + (p.r.ins - 50) * 0.002, 0.04, 0.3);
      let tpm = Math.round((pt * f3) / 3 + (rnd() - 0.5));
      tpm = clamp(tpm, 0, Math.floor(pt / 3));
      let ftm = Math.round(pt * fft + (rnd() - 0.5) * 2);
      ftm = clamp(ftm, 0, pt - tpm * 3);
      if ((pt - tpm * 3 - ftm) % 2) ftm += ftm > 0 && rnd() < 0.5 ? -1 : 1;
      ftm = clamp(ftm, 0, pt - tpm * 3);
      const twom = Math.max(0, (pt - tpm * 3 - ftm) / 2);
      const p3 = clamp(0.25 + p.r.thr * 0.0017 + randn() * 0.06, 0.15, 0.6);
      const p2 = clamp(0.41 + p.r.ins * 0.0017 + randn() * 0.06, 0.3, 0.72);
      const pf = clamp(0.58 + p.r.fts * 0.0033, 0.5, 0.96);
      const tpa = tpm + Math.round((tpm || (p.r.thr > 50 && x.min > 12 ? 1 : 0)) * (1 / p3 - 1) + (rnd() - 0.3));
      const twoa = Math.round(twom / p2 + (rnd() - 0.5) * 0.8);
      const fta = ftm + Math.round(ftm * (1 / pf - 1) + rnd() * 0.7);
      return { id: p.id, min: Math.round(x.min), start: x.start, pts: pt, tpm, tpa, fgm: twom + tpm, fga: twoa + tpa, ftm, fta, reb: 0, ast: 0, stl: 0, blk: 0, tov: 0 };
    });
    const fgm = sum(lines.map((l) => l.fgm));
    const teamReb = clamp(Math.round(34 + (pts - oppPts) * 0.08 + randn() * 4), 22, 50);
    const rebA = alloc(teamReb, (p) => Math.exp((p.r.reb - 50) / 22));
    const astA = alloc(Math.round(fgm * (0.58 + randn() * 0.06)), (p) => Math.exp((p.r.ply - 50) / 15));
    const stlA = alloc(clamp(Math.round(7.5 + randn() * 2.5), 1, 16), (p) => Math.exp((p.r.def + p.r.ath - 100) / 24));
    const blkA = alloc(clamp(Math.round(3.8 + randn() * 1.8), 0, 11), (p) => Math.exp((p.r.reb + p.r.def + p.r.ath - 150) / 22));
    const tovA = alloc(clamp(Math.round(13 + randn() * 3), 5, 24), (p) => Math.exp((off(p) - 55) / 30) * Math.exp((p.r.ply - 50) / 60));
    lines.forEach((l, i) => { l.reb = rebA[i]; l.ast = astA[i]; l.stl = stlA[i]; l.blk = blkA[i]; l.tov = tovA[i]; });
    return lines;
  }

  function applyBox(box, playoff) {
    for (const tid of [box.home, box.away]) {
      for (const l of box.players[tid]) {
        const p = P(l.id);
        const bucket = playoff ? p.po : p.stats;
        const st = (bucket[S.season] ||= { team: tid, ...Object.fromEntries(STAT_KEYS.map((k) => [k, 0])) });
        st.team = tid;
        st.gp++; if (l.start) st.gs++;
        for (const k of ["min", "pts", "reb", "ast", "stl", "blk", "tov", "fgm", "fga", "tpm", "tpa", "ftm", "fta"]) st[k] += l[k];
        // Injury roll
        if (p.inj === 0 && rnd() < 0.0045 * (l.min / 30)) {
          const g = Math.max(1, Math.round(-Math.log(rnd()) * 5));
          p.inj = g; p.injType = pick(["ankle sprain", "knee soreness", "hamstring strain", "back spasms", "concussion protocol", "foot soreness", "illness", "wrist sprain"]);
          if (g >= 5 && (tid === S.userTeam || p.r.ovr >= 75)) log(`${p.name} (${tid}) is out ~${g} games with ${p.injType}.`, tid);
        }
      }
    }
  }
  function healDay(tids) {
    for (const p of Object.values(S.players)) if (p.inj > 0 && p.team && (!tids || tids.has(p.team))) { p.inj--; if (!p.inj) p.injType = null; }
  }

  // ---------- regular season ----------
  function startSeason() {
    const ut = S.userTeam;
    const n = roster(ut).length;
    if (n < S.econ.rosterMin) return { ok: false, msg: `You need at least ${S.econ.rosterMin} players to start the season (you have ${n}). Sign free agents first.` };
    if (n > S.econ.rosterMax) return { ok: false, msg: `Your roster has ${n} players; the limit is ${S.econ.rosterMax}. Release or trade players first.` };
    for (const t of S.teams) if (t.id !== ut) aiRosterFix(t.id);
    S.phase = "regular"; S.day = 0;
    log(`The ${S.season} regular season is underway.`);
    save(); emit();
    return { ok: true };
  }

  function simDays(nDays) {
    if (S.phase !== "regular") return;
    const end = lastDay();
    for (let i = 0; i < nDays && S.day < end; i++) {
      S.day++;
      const games = S.schedule.filter((g) => g.day === S.day && !g.played);
      for (const g of games) {
        const box = simGame(g.home, g.away, { gid: g.gid });
        g.played = true; g.hs = box.hs; g.as = box.as; g.ot = box.ot;
        S.boxes[g.gid] = box;
        applyBox(box, false);
        const h = T(g.home), a = T(g.away);
        h.pf += box.hs; h.pa += box.as; a.pf += box.as; a.pa += box.hs;
        if (box.hs > box.as) { h.w++; h.hw++; a.l++; h.streak = h.streak > 0 ? h.streak + 1 : 1; a.streak = a.streak < 0 ? a.streak - 1 : -1; }
        else { a.w++; h.l++; h.hl++; a.streak = a.streak > 0 ? a.streak + 1 : 1; h.streak = h.streak < 0 ? h.streak - 1 : -1; }
      }
      healDay();
      if (S.day % 4 === 0) aiDaily();
    }
    if (S.day >= end) endRegularSeason();
    save(); emit();
  }
  const tradeDeadlineDay = () => Math.round(lastDay() * 0.65);
  const tradesOpen = () => S.phase !== "playoffs" && !(S.phase === "regular" && S.day > tradeDeadlineDay()) && S.phase !== "draft";

  function standings() {
    return S.teams.slice().sort((a, b) => {
      const pa = a.w / Math.max(1, a.w + a.l), pb = b.w / Math.max(1, b.w + b.l);
      if (pb !== pa) return pb - pa;
      return (b.pf - b.pa) - (a.pf - a.pa);
    });
  }

  // ---------- playoffs ----------
  function endRegularSeason() {
    const st = standings();
    const seeds = st.slice(0, 8).map((t) => t.id);
    S.seasonSeeds = st.map((t) => t.id);
    log(`Regular season complete. ${teamName(st[0].id)} finish first at ${st[0].w}-${st[0].l}.`);
    const mk = (a, b, bestOf) => ({ hi: a, lo: b, bestOf, wh: 0, wl: 0, games: [], winner: null });
    S.playoffs = {
      seeds,
      rounds: [[mk(seeds[0], seeds[7], 3), mk(seeds[3], seeds[4], 3), mk(seeds[1], seeds[6], 3), mk(seeds[2], seeds[5], 3)]],
      bestOf: [3, 5, 7], champion: null,
    };
    S.awards = computeAwards();
    S.phase = "playoffs";
    const ut = S.userTeam;
    log(seeds.includes(ut) ? `You're in: the ${teamName(ut)} are the #${seeds.indexOf(ut) + 1} seed.` : `The ${teamName(ut)} missed the playoffs.`, ut);
  }

  function simPlayoffGame() {
    const po = S.playoffs; if (!po || po.champion) return false;
    const round = po.rounds[po.rounds.length - 1];
    const active = round.filter((s) => !s.winner);
    if (!active.length) { advancePlayoffRound(); return true; }
    for (const s of active) {
      const gnum = s.games.length;
      // 2-2-1-1-1 style: higher seed hosts games 1,2,5,7 (bo3: 1,3)
      const hiHome = s.bestOf === 3 ? gnum !== 1 : [0, 1, 4, 6].includes(gnum);
      const home = hiHome ? s.hi : s.lo, away = hiHome ? s.lo : s.hi;
      const box = simGame(home, away, { gid: `po${S.season}-${s.hi}-${s.lo}-${gnum + 1}` });
      S.boxes[box.gid] = box;
      applyBox(box, true);
      const hiWon = (home === s.hi) === (box.hs > box.as);
      if (hiWon) s.wh++; else s.wl++;
      s.games.push({ home, away, hs: box.hs, as: box.as, gid: box.gid });
      const need = Math.ceil(s.bestOf / 2);
      if (s.wh === need || s.wl === need) {
        s.winner = s.wh === need ? s.hi : s.lo;
        const loser = s.winner === s.hi ? s.lo : s.hi;
        log(`${teamName(s.winner)} beat the ${teamName(loser)} ${Math.max(s.wh, s.wl)}-${Math.min(s.wh, s.wl)}.`, s.winner);
      }
    }
    healDay(new Set(active.flatMap((s) => [s.hi, s.lo])));
    if (!round.some((s) => !s.winner)) advancePlayoffRound();
    return true;
  }
  function advancePlayoffRound() {
    const po = S.playoffs;
    const round = po.rounds[po.rounds.length - 1];
    const winners = round.map((s) => s.winner);
    if (winners.length === 1) {
      po.champion = winners[0];
      const fin = round[0];
      po.runnerUp = fin.winner === fin.hi ? fin.lo : fin.hi;
      po.finalsMvp = finalsMvp(po.champion);
      log(`🏆 The ${teamName(po.champion)} are the ${S.season} WNBA champions! Finals MVP: ${P(po.finalsMvp)?.name}.`, po.champion);
      return;
    }
    const seedOf = (id) => po.seeds.indexOf(id);
    const next = [];
    for (let i = 0; i < winners.length; i += 2) {
      let [a, b] = [winners[i], winners[i + 1]];
      if (seedOf(b) < seedOf(a)) [a, b] = [b, a];
      next.push({ hi: a, lo: b, bestOf: po.bestOf[po.rounds.length], wh: 0, wl: 0, games: [], winner: null });
    }
    po.rounds.push(next);
  }
  function simPlayoffs(untilEnd) {
    if (S.phase !== "playoffs") return;
    if (untilEnd) { let guard = 0; while (!S.playoffs.champion && guard++ < 50) simPlayoffGame(); }
    else {
      const startRounds = S.playoffs.rounds.length;
      let guard = 0;
      while (!S.playoffs.champion && S.playoffs.rounds.length === startRounds && guard++ < 10) simPlayoffGame();
    }
    save(); emit();
  }
  function simPlayoffDay() { if (S.phase === "playoffs") { simPlayoffGame(); save(); emit(); } }

  // ---------- awards ----------
  function perGame(p, season = S.season, po = false) {
    const st = (po ? p.po : p.stats)[season];
    if (!st || !st.gp) return null;
    const g = st.gp;
    return {
      team: st.team, gp: g, gs: st.gs, min: round1(st.min / g), pts: round1(st.pts / g), reb: round1(st.reb / g), ast: round1(st.ast / g),
      stl: round1(st.stl / g), blk: round1(st.blk / g), tov: round1(st.tov / g),
      fg: st.fga ? st.fgm / st.fga : 0, tp: st.tpa ? st.tpm / st.tpa : 0, ft: st.fta ? st.ftm / st.fta : 0,
      ts: st.fga + st.fta ? st.pts / (2 * (st.fga + 0.44 * st.fta)) : 0,
    };
  }
  function awardScore(p) {
    const s = perGame(p); if (!s || s.gp < 20) return -1;
    const t = T(s.team); const wp = t.w / Math.max(1, t.w + t.l);
    return s.pts + 1.1 * s.reb + 1.4 * s.ast + 2 * (s.stl + s.blk) - s.tov + (s.ts - 0.54) * 40 + wp * 12;
  }
  function computeAwards() {
    const ps = Object.values(S.players).filter((p) => p.team && perGame(p));
    const by = (f) => ps.filter((p) => f(p) > -1).sort((a, b) => f(b) - f(a));
    const mvp = by(awardScore);
    const roy = by((p) => (p.exp === 0 ? awardScore(p) : -1));
    const dpoy = by((p) => { const s = perGame(p); if (!s || s.gp < 20) return -1; return 3 * (s.stl + s.blk) + 0.4 * s.reb + p.r.def * 0.12 + s.min * 0.05; });
    const a = { mvp: mvp[0]?.id, roy: roy[0]?.id, dpoy: dpoy[0]?.id, allFirst: mvp.slice(0, 5).map((p) => p.id), allSecond: mvp.slice(5, 10).map((p) => p.id) };
    if (a.mvp) log(`${P(a.mvp).name} is the ${S.season} MVP.`, P(a.mvp).team);
    if (a.roy) log(`${P(a.roy).name} is the ${S.season} Rookie of the Year.`, P(a.roy).team);
    if (a.dpoy) log(`${P(a.dpoy).name} is the ${S.season} Defensive Player of the Year.`, P(a.dpoy).team);
    return a;
  }
  function finalsMvp(tid) {
    const ps = roster(tid).filter((p) => p.po[S.season]);
    ps.sort((a, b) => { const x = a.po[S.season], y = b.po[S.season]; return (y.pts + y.reb + y.ast) - (x.pts + x.reb + x.ast); });
    return ps[0]?.id;
  }

  // ---------- offseason ----------
  // Phases: playoffs(done) -> draft -> resign -> freeagency -> preseason(next season)
  function advanceToDraft() {
    if (S.phase !== "playoffs" || !S.playoffs?.champion) return;
    const po = S.playoffs;
    const st = standings();
    S.history.unshift({
      season: S.season, champion: po.champion, runnerUp: po.runnerUp, finalsMvp: po.finalsMvp, ...S.awards,
      standings: st.map((t) => ({ id: t.id, w: t.w, l: t.l })),
      userRecord: { w: T(S.userTeam).w, l: T(S.userTeam).l, seed: po.seeds.indexOf(S.userTeam) + 1 },
    });
    // Archive season lines into careers.
    for (const p of Object.values(S.players)) {
      const s = perGame(p);
      if (s) p.career.push({ season: S.season, ...s, ovr: p.r.ovr });
    }
    // Draft order: lottery among non-playoff teams, then playoff teams by record (worst first).
    const nonPO = S.seasonSeeds.slice(8).reverse(); // worst first
    const weights = [30, 22, 16, 12, 9, 6, 5];
    const lottery = [];
    const pool = nonPO.map((id, i) => ({ id, w: weights[i] ?? 3 }));
    for (let k = 0; k < Math.min(4, pool.length); k++) {
      const W = sum(pool.map((x) => x.w)); let r = rnd() * W; let idx = 0;
      while (r > pool[idx].w) { r -= pool[idx].w; idx++; }
      lottery.push(pool.splice(idx, 1)[0].id);
    }
    const order1 = lottery.concat(pool.map((x) => x.id), S.seasonSeeds.slice(0, 8).reverse());
    const slots = [];
    for (const rd of [1, 2, 3]) {
      const ord = rd === 1 ? order1 : S.seasonSeeds.slice().reverse();
      ord.forEach((orig) => {
        const pk = S.picks.find((x) => x.season === S.season && x.round === rd && x.orig === orig);
        slots.push({ round: rd, orig, owner: pk ? pk.owner : orig, player: null });
      });
    }
    slots.forEach((s, i) => (s.pick = i + 1));
    S.draft = { season: S.season, slots, cur: 0, lottery };
    log(`Draft lottery: ${teamName(lottery[0])} win the #1 pick.`, lottery[0]);
    S.phase = "draft";
    save(); emit();
  }
  const draftOnClock = () => S.draft && S.draft.slots[S.draft.cur];
  const availableProspects = () => S.prospects.map(P).filter((p) => p && !p.team && p.prospect === S.season);

  function rookieContract(slot) {
    const e = S.econ;
    if (slot.round === 1) {
      const sal = e.rookieTop - ((slot.pick - 1) * (e.rookieTop - e.min * 1.16)) / 14;
      return { sal: Math.round(sal / 1000) * 1000, yrs: 4, rookie: true };
    }
    return { sal: e.min, yrs: 2, rookie: true, nonGuaranteed: true };
  }
  function draftPlayer(pid) {
    const slot = draftOnClock(); if (!slot) return;
    const p = P(pid);
    p.team = slot.owner; p.c = rookieContract(slot); p.prospect = null; p.exp = 0;
    p.acq = `#${slot.pick} pick in ${S.season} draft`;
    p.draftInfo = { season: S.season, pick: slot.pick, round: slot.round, team: slot.owner };
    slot.player = pid;
    if (slot.round === 1 || slot.owner === S.userTeam) log(`Pick ${slot.pick}: ${teamName(slot.owner)} select ${p.name} (${p.school}).`, slot.owner);
    S.draft.cur++;
    if (S.draft.cur >= S.draft.slots.length) finishDraft();
  }
  function aiDraftChoice(tid) {
    const mode = teamMode(tid);
    const av = availableProspects();
    av.sort((a, b) => {
      const va = a.r.ovr * (mode === "contend" ? 0.65 : 0.45) + a.r.pot * (mode === "contend" ? 0.35 : 0.55) + randn() * 2;
      const vb = b.r.ovr * (mode === "contend" ? 0.65 : 0.45) + b.r.pot * (mode === "contend" ? 0.35 : 0.55) + randn() * 2;
      return vb - va;
    });
    return av[0]?.id;
  }
  // Auto-pick until it's the user's turn (or the draft ends).
  function draftUntilUser(includeUser) {
    let guard = 0;
    while (S.phase === "draft" && draftOnClock() && guard++ < 100) {
      const slot = draftOnClock();
      if (slot.owner === S.userTeam && !includeUser) break;
      const pid = aiDraftChoice(slot.owner);
      if (!pid) { S.draft.cur++; continue; }
      draftPlayer(pid);
    }
    save(); emit();
  }
  function userDraft(pid) {
    const slot = draftOnClock();
    if (!slot || slot.owner !== S.userTeam) return;
    draftPlayer(pid); save(); emit();
  }
  function finishDraft() {
    // Undrafted prospects become free agents.
    for (const p of availableProspects()) { p.prospect = null; p.ask = { sal: S.econ.min, yrs: 1 }; }
    S.picks = S.picks.filter((x) => x.season !== S.season);
    addPicksFor(S.season + 2);
    S.phase = "resign";
    // Expiring contracts: yrs counts seasons remaining including the one just played.
    for (const p of Object.values(S.players)) if (p.team && !p.retired) {
      if (p.c.yrs <= 1 && !(p.draftInfo && p.draftInfo.season === S.season)) {
        p.expiring = true; p.ask = askingContract(p); p.mood = 0.85 + rnd() * 0.3;
      }
    }
    log(`The ${S.season} draft is complete. Teams now decide on their expiring contracts.`);
  }

  function resignPlayer(pid) {
    const p = P(pid);
    if (!p.expiring || p.team !== S.userTeam) return { ok: false };
    p.resign = true; p.expiring = false;
    p.c = { sal: p.ask.sal, yrs: p.ask.yrs + 1, rookie: false }; // +1 because the old season rolls off at advance
    log(`${teamName(S.userTeam)} re-sign ${p.name}: ${fmtMoney(p.ask.sal)} x ${p.ask.yrs}.`, S.userTeam);
    save(); emit();
    return { ok: true };
  }
  function letGo(pid) { const p = P(pid); if (p.team === S.userTeam && p.expiring) { p.declined = true; save(); emit(); } }

  function advanceToFreeAgency() {
    if (S.phase !== "resign") return;
    // AI decisions on expiring players.
    for (const p of Object.values(S.players)) {
      if (!p.team || !p.expiring) continue;
      if (p.team === S.userTeam) {
        if (!p.resign) toFreeAgency(p);
        continue;
      }
      const keep = (p.r.ovr >= 60 || (p.age <= 25 && p.r.pot >= 65)) && rnd() < 0.7 && p.age <= 33;
      if (keep) { p.c = { sal: p.ask.sal, yrs: p.ask.yrs + 1, rookie: false }; p.expiring = false; }
      else toFreeAgency(p);
    }
    // Season rolls: contracts tick down, players age and develop, some retire.
    for (const p of Object.values(S.players)) {
      if (p.retired) continue;
      const justDrafted = p.draftInfo && p.draftInfo.season === S.season;
      if (p.team && !justDrafted) p.c.yrs = Math.max(0, p.c.yrs - 1);
      p.expiring = false; p.resign = false; p.declined = false;
    }
    progressPlayers();
    retirements();
    S.season++;
    for (const k of ["cap", "max", "min", "rookieTop"]) S.econ[k] = Math.round((S.econ[k] * (1 + S.econ.growth)) / 5000) * 5000;
    for (const t of S.teams) { t.dead = t.dead.filter((d) => d.season >= S.season); }
    S.prospects = genProspects(S.season);
    S.phase = "freeagency"; S.faDay = 0;
    for (const p of freeAgents()) p.ask = askingContract(p);
    log(`Free agency is open. The ${S.season} salary cap is ${fmtMoney(S.econ.cap)}.`);
    save(); emit();
  }
  function toFreeAgency(p) {
    const from = p.team;
    p.team = null; p.c = { sal: 0, yrs: 0, rookie: false }; p.expiring = false;
    p.ask = askingContract(p);
    if (p.r.ovr >= 68) log(`${p.name} hits free agency after leaving the ${teamName(from)}.`, from);
  }
  function progressPlayers() {
    const curve = (age) => age <= 21 ? 3 : age <= 22 ? 2.6 : age <= 23 ? 2.2 : age <= 24 ? 1.6 : age <= 25 ? 1.0 : age <= 26 ? 0.6 : age <= 27 ? 0.3 : age <= 28 ? 0 : age <= 29 ? -0.6 : age <= 30 ? -1.1 : age <= 31 ? -1.7 : age <= 32 ? -2.4 : age <= 33 ? -3 : -4;
    for (const p of Object.values(S.players)) {
      if (p.retired) continue;
      p.age++;
      if (p.stats[S.season]) p.exp = (p.exp || 0) + 1;
      let d = curve(p.age) + randn() * 2.4;
      if (p.age <= 26 && p.r.pot > p.r.ovr) d += (p.r.pot - p.r.ovr) * 0.1;
      const old = p.r.ovr;
      p.r.ovr = Math.round(clamp(p.r.ovr + d, 30, 99));
      const dd = p.r.ovr - old;
      for (const k of ["ins", "thr", "fts", "ply", "reb", "def", "ath"]) {
        const f = k === "ath" ? (p.age >= 29 ? 1.5 : 0.8) : 0.6 + rnd() * 0.8;
        p.r[k] = Math.round(clamp(p.r[k] + dd * f + randn(), 20, 99));
      }
      p.r.pot = p.age >= 28 ? p.r.ovr : Math.round(clamp(Math.max(p.r.ovr, p.r.pot + randn() * 2), p.r.ovr, 99));
      if (p.team === S.userTeam && Math.abs(dd) >= 4) log(`${p.name} ${dd > 0 ? "improved" : "declined"} ${dd > 0 ? "+" : ""}${dd} over the offseason (now ${p.r.ovr}).`, S.userTeam);
    }
  }
  function retirements() {
    for (const p of Object.values(S.players)) {
      if (p.retired || p.prospect) continue;
      let pr = 0;
      if (p.age >= 35) pr = 0.35 + (p.age - 35) * 0.15;
      else if (p.age >= 32) pr = p.r.ovr < 60 ? 0.3 : 0.05;
      if (!p.team && p.age >= 29 && p.r.ovr < 50) pr += 0.4;
      if (p.team && p.c.yrs > 0) pr *= 0.3; // under contract: usually plays it out
      if (rnd() < pr) {
        p.retired = S.season;
        if (p.r.ovr >= 65 || p.team === S.userTeam) log(`${p.name} has retired after ${p.exp} seasons.`, p.team);
        p.team = null;
      }
    }
  }

  // ---------- free agency ----------
  function offerContract(pid, sal, yrs) {
    const p = P(pid), ut = S.userTeam;
    if (!p || p.team) return { ok: false, msg: "That player is no longer available." };
    if (roster(ut).length >= S.econ.rosterMax) return { ok: false, msg: `Your roster is full (${S.econ.rosterMax}). Release someone first.` };
    sal = Math.round(clamp(sal, S.econ.min, S.econ.max));
    const minException = sal <= S.econ.min && roster(ut).length < S.econ.rosterMin;
    if (payroll(ut) + sal > S.econ.cap && !minException) return { ok: false, msg: `That offer puts you ${fmtMoney(payroll(ut) + sal - S.econ.cap)} over the hard cap.` };
    const ask = p.ask || askingContract(p);
    // Players weigh salary most, but like contenders and years that match their ask.
    const contender = 1 + (8 - projectedRank(ut)) * 0.006;
    const yrsFit = 1 - Math.abs(yrs - ask.yrs) * 0.03;
    const score = (sal / ask.sal) * contender * yrsFit;
    if (score < 0.97) {
      return { ok: false, msg: `${p.name} turned it down. She's looking for about ${fmtMoney(ask.sal)} over ${ask.yrs} year${ask.yrs > 1 ? "s" : ""}.` };
    }
    p.team = ut; p.c = { sal, yrs, rookie: false }; p.ask = null;
    p.acq = `Signed in ${S.phase === "freeagency" ? "free agency" : "season"} ${S.season}`;
    log(`${teamName(ut)} sign ${p.name}: ${fmtMoney(sal)} x ${yrs}.`, ut);
    save(); emit();
    return { ok: true, msg: `${p.name} signed: ${fmtMoney(sal)} for ${yrs} year${yrs > 1 ? "s" : ""}.` };
  }
  function releasePlayer(pid) {
    const p = P(pid), ut = S.userTeam;
    if (!p || p.team !== ut) return { ok: false };
    if (!p.c.nonGuaranteed && p.c.sal > 0 && S.phase !== "freeagency") T(ut).dead.push({ name: p.name, sal: p.c.sal, season: S.season });
    else if (!p.c.nonGuaranteed && p.c.sal > 0) T(ut).dead.push({ name: p.name, sal: Math.round(p.c.sal / 2), season: S.season });
    p.team = null; p.c = { sal: 0, yrs: 0, rookie: false }; p.ask = askingContract(p);
    const t = T(ut); if (t.rotation) t.rotation = t.rotation.filter((x) => x !== pid);
    log(`${teamName(ut)} release ${p.name}.`, ut);
    save(); emit();
    return { ok: true };
  }
  function faDays(n) {
    if (S.phase !== "freeagency") return;
    for (let i = 0; i < n; i++) { S.faDay++; aiFreeAgency(0.4); }
    save(); emit();
  }
  // AI teams sign the best free agents they can afford.
  function aiFreeAgency(intensity = 1, fillOnly = false) {
    const fas = freeAgents().sort((a, b) => talent(b) - talent(a));
    for (const t of shuffle(S.teams.slice())) {
      if (t.id === S.userTeam) continue;
      const n = roster(t.id).length;
      if (n >= S.econ.rosterMax) continue;
      if (fillOnly && n >= S.econ.rosterMin) continue;
      if (!fillOnly && rnd() > intensity && n >= S.econ.rosterMin) continue;
      const space = capSpace(t.id);
      const worst = roster(t.id).sort((a, b) => a.r.ovr - b.r.ovr)[0];
      for (const p of fas) {
        if (p.team) continue;
        const ask = p.ask || askingContract(p);
        const need = n < S.econ.rosterMin;
        if (ask.sal <= space || (need && ask.sal <= S.econ.min * 1.0001)) {
          if (!need && worst && p.r.ovr < worst.r.ovr + 2) continue;
          p.team = t.id; p.c = { sal: ask.sal, yrs: ask.yrs, rookie: false }; p.ask = null;
          p.acq = `Signed ${S.season}`;
          if (p.r.ovr >= 65) log(`${p.name} signs with the ${teamName(t.id)} (${fmtMoney(ask.sal)} x ${ask.yrs}).`, t.id);
          break;
        }
        if (need) {
          // Desperate: take the best min-salary guy available.
          const cheap = fas.find((x) => !x.team && (x.ask?.sal || 0) <= S.econ.min * 1.3);
          if (cheap) { cheap.team = t.id; cheap.c = { sal: S.econ.min, yrs: 1, rookie: false }; cheap.ask = null; }
          break;
        }
      }
    }
  }
  function aiRosterFix(tid, initial) {
    // Trim to max by releasing the lowest-rated players; fill to min with cheap FAs.
    let ps = roster(tid).sort((a, b) => a.r.ovr - b.r.ovr);
    while (ps.length > S.econ.rosterMax) {
      const p = ps.shift(); p.team = null; p.c = { sal: 0, yrs: 0, rookie: false }; p.ask = askingContract(p);
      if (!initial) log(`${teamName(tid)} waive ${p.name}.`, tid);
    }
    let guard = 0;
    while (roster(tid).length < S.econ.rosterMin && guard++ < 10) {
      const fa = freeAgents().sort((a, b) => b.r.ovr - a.r.ovr)[0];
      if (!fa) break;
      const sal = Math.max(S.econ.min, Math.min(fa.ask?.sal || S.econ.min, capSpace(tid)));
      fa.team = tid; fa.c = { sal, yrs: 1, rookie: false }; fa.ask = null;
    }
  }
  function aiDaily() {
    // In-season: teams with injuries or short rosters patch them.
    for (const t of S.teams) if (t.id !== S.userTeam) {
      const healthy = roster(t.id).filter((p) => !p.inj).length;
      if (healthy < 9 && roster(t.id).length < S.econ.rosterMax) aiRosterFix(t.id);
    }
  }
  function startNextSeason() {
    if (S.phase !== "freeagency") return { ok: false };
    const ut = S.userTeam;
    const n = roster(ut).length;
    if (n > S.econ.rosterMax) return { ok: false, msg: `Your roster has ${n} players; the limit is ${S.econ.rosterMax}.` };
    for (let i = 0; i < 4; i++) aiFreeAgency(0.6);
    for (const t of S.teams) if (t.id !== ut) aiRosterFix(t.id);
    // Unsigned old free agents retire.
    for (const p of freeAgents()) if (p.age >= 31 && rnd() < 0.5) p.retired = S.season;
    // Reset season state.
    for (const t of S.teams) Object.assign(t, { w: 0, l: 0, hw: 0, hl: 0, pf: 0, pa: 0, streak: 0 });
    for (const p of Object.values(S.players)) p.inj = 0;
    S.boxes = {}; S.playoffs = null; S.draft = null; S.awards = null; S.day = 0;
    S.schedule = makeSchedule();
    S.phase = "preseason";
    log(`Preseason ${S.season}. Set your roster: you need ${S.econ.rosterMin}-${S.econ.rosterMax} players.`);
    save(); emit();
    return { ok: true };
  }

  // ---------- trades ----------
  function evaluateTrade(partner, give, get, givePicks = [], getPicks = []) {
    // give/get = arrays of player ids from the user's perspective.
    const ut = S.userTeam;
    const valIn = sum(give.map((id) => playerValue(P(id), partner))) + sum(givePicks.map((k) => pickValue(S.picks[k], partner)));
    const valOut = sum(get.map((id) => playerValue(P(id), partner))) + sum(getPicks.map((k) => pickValue(S.picks[k], partner)));
    const salIn = sum(give.map((id) => P(id).c.sal)), salOut = sum(get.map((id) => P(id).c.sal));
    const issues = [];
    if (!tradesOpen()) issues.push(S.phase === "regular" ? "The trade deadline has passed." : "Trades are closed right now.");
    if (!give.length && !get.length && !givePicks.length && !getPicks.length) issues.push("Add players or picks to the deal.");
    const userAfter = payroll(ut) - salIn + salOut, partnerAfter = payroll(partner) - salOut + salIn;
    if (userAfter > S.econ.cap && salOut > salIn) issues.push(`You'd be ${fmtMoney(userAfter - S.econ.cap)} over the hard cap.`);
    if (partnerAfter > S.econ.cap && salIn > salOut) issues.push(`The ${T(partner).name} would be over the hard cap.`);
    const uN = roster(ut).length - give.length + get.length, pN = roster(partner).length - get.length + give.length;
    if (uN > S.econ.rosterMax) issues.push(`You'd have ${uN} players (max ${S.econ.rosterMax}).`);
    if (pN > S.econ.rosterMax) issues.push(`They'd have ${pN} players (max ${S.econ.rosterMax}).`);
    // AI wants a margin; untouchable stars are expensive.
    const need = valOut * 1.08 + 1.5;
    const ratio = need > 0 ? valIn / need : 1;
    return { valIn, valOut, need, ratio, accept: ratio >= 1 && !issues.length, issues };
  }
  function proposeTrade(partner, give, get, givePicks = [], getPicks = []) {
    const ev = evaluateTrade(partner, give, get, givePicks, getPicks);
    if (!ev.accept) return { ok: false, ev };
    const ut = S.userTeam;
    give.forEach((id) => { const p = P(id); p.team = partner; p.acq = `Traded from ${ut} ${S.season}`; });
    get.forEach((id) => { const p = P(id); p.team = ut; p.acq = `Traded from ${partner} ${S.season}`; });
    givePicks.forEach((k) => (S.picks[k].owner = partner));
    getPicks.forEach((k) => (S.picks[k].owner = ut));
    const pkName = (k) => pickLabel(S.picks[k]);
    const desc = `${teamName(ut)} trade ${[...give.map((id) => P(id).name), ...givePicks.map(pkName)].join(", ") || "nothing"} to the ${teamName(partner)} for ${[...get.map((id) => P(id).name), ...getPicks.map(pkName)].join(", ") || "nothing"}.`;
    log(desc, ut);
    S.tradeLog.unshift({ season: S.season, text: desc });
    const t = T(ut); if (t.rotation) t.rotation = t.rotation.filter((x) => !give.includes(x));
    aiRosterFix(partner);
    save(); emit();
    return { ok: true, ev, desc };
  }
  // Ask the AI what it would take: greedily add the user's assets that close
  // the gap most efficiently (up to 4 additions).
  function suggestBalance(partner, give, get, givePicks, getPicks) {
    give = give.slice(); givePicks = givePicks.slice();
    let ev = evaluateTrade(partner, give, get, givePicks, getPicks);
    if (ev.ratio >= 1 && !ev.issues.length) return { type: "ok" };
    const added = [], addedPicks = [];
    for (let step = 0; step < 4; step++) {
      const opts = [];
      for (const p of roster(S.userTeam)) if (!give.includes(p.id) && playerValue(p, partner) > 0.5)
        opts.push({ kind: "p", id: p.id, ev: evaluateTrade(partner, [...give, p.id], get, givePicks, getPicks) });
      S.picks.forEach((pk, k) => { if (pk.owner === S.userTeam && !givePicks.includes(k))
        opts.push({ kind: "k", id: k, ev: evaluateTrade(partner, give, get, [...givePicks, k], getPicks) }); });
      if (!opts.length) break;
      // Prefer the cheapest single addition that completes the deal; otherwise the biggest step.
      const done = opts.filter((o) => o.ev.ratio >= 1 && !o.ev.issues.length).sort((a, b) => a.ev.ratio - b.ev.ratio);
      const choice = done[0] || opts.sort((a, b) => b.ev.ratio - a.ev.ratio)[0];
      if (choice.kind === "p") { give.push(choice.id); added.push(choice.id); } else { givePicks.push(choice.id); addedPicks.push(choice.id); }
      if (done.length) return { type: "add", pids: added, picks: addedPicks };
    }
    return { type: "none" };
  }
  function pickLabel(pk) {
    const rd = ["", "1st", "2nd", "3rd"][pk.round];
    return `${pk.season} ${rd}-round pick${pk.orig !== pk.owner ? ` (via ${pk.orig})` : ""}`;
  }

  // ---------- money ----------
  function fmtMoney(x) {
    if (Math.abs(x) >= 1e6) return "$" + (x / 1e6).toFixed(2) + "M";
    return "$" + Math.round(x / 1000) + "K";
  }

  // ---------- persistence ----------
  function save() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { /* storage unavailable */ }
  }
  function load() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return null;
      S = JSON.parse(raw); rankCache = null; emit(); return S;
    } catch (e) { return null; }
  }
  function importState(obj) { S = obj; rankCache = null; save(); emit(); }
  function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} S = null; rankCache = null; }
  function hasSave() { try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; } }

  // Preview team ratings before a game exists (team picker).
  function previewTeams() {
    const tmp = S; // may be null
    S = { players: {}, teams: D.teams.map((t) => ({ ...t, dead: [] })), userTeam: null, econ: { rosterMax: 99 } };
    for (const p of D.players) S.players[p.id] = { ...p, inj: 0 };
    const out = D.teams.map((t) => {
      const ps = roster(t.id).sort((a, b) => b.r.ovr - a.r.ovr);
      return { ...t, rating: teamRating(t.id), payroll: sum(ps.map((p) => p.c.sal)), top: ps.slice(0, 3).map((p) => ({ name: p.name, ovr: p.r.ovr })), n: ps.length };
    });
    S = tmp;
    return out;
  }

  window.GM = {
    get S() { return S; }, data: D,
    newGame, load, save, importState, clearSave, hasSave, previewTeams, onChange: (f) => listeners.push(f),
    P, T, teamName, roster, freeAgents, payroll, capSpace, teamRating, rotation, setRotation, powerRanks, teamMode,
    playerValue, pickValue, pickLabel, marketSalary, talent,
    startSeason, simDays, lastDay, tradeDeadlineDay, tradesOpen, standings, simPlayoffs, simPlayoffDay,
    advanceToDraft, draftOnClock, availableProspects, draftUntilUser, userDraft,
    resignPlayer, letGo, advanceToFreeAgency, faDays, startNextSeason,
    offerContract, releasePlayer, evaluateTrade, proposeTrade, suggestBalance,
    perGame, fmtMoney, STAT_KEYS,
  };
})();

</script>
<script>
// WNBA GM simulator UI: renders views from GM.S and wires up actions.
(function () {
  "use strict";
  const $ = (sel) => document.querySelector(sel);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const money = (x) => GM.fmtMoney(x);
  const pct = (x) => (x ? (x * 100).toFixed(1) : "–");
  const f1 = (x) => (x == null ? "–" : (+x).toFixed(1));
  const ht = (i) => (i ? `${Math.floor(i / 12)}'${i % 12}"` : "–");

  const ui = {
    tab: "dashboard",
    sort: {},
    trade: { partner: null, give: new Set(), get: new Set(), givePicks: new Set(), getPicks: new Set(), msg: null },
    offer: null,
    modal: null,
    newsMine: false,
    leaders: "pts",
    players: { q: "", team: "all", sort: "ovr" },
    confirm: null,
  };

  // ---------- shared bits ----------
  const tier = (o) => (o >= 80 ? "t1" : o >= 70 ? "t2" : o >= 60 ? "t3" : "t4");
  const ovr = (o) => `<span class="ovr ${tier(o)}">${o}</span>`;
  const rt = (v) => `<span class="rt ${v >= 75 ? "hi" : v >= 55 ? "mid" : "lo"}">${v}</span>`;
  const badge = (tid, big) => { const t = GM.T(tid); return t ? `<span class="badge${big ? " big" : ""}" style="background:${t.color}">${tid}</span>` : `<span class="badge" style="background:var(--tier-4)">FA</span>`; };
  const plink = (p) => `<button class="plink" data-act="player" data-id="${p.id}">${esc(p.name)}</button><span class="pos">${esc(p.pos)}</span>`;
  const rec = (t) => `${t.w}-${t.l}`;
  const phaseLabel = { preseason: "Preseason", regular: "Regular season", playoffs: "Playoffs", draft: "Draft", resign: "Re-signings", freeagency: "Free agency" };

  function toast(msg, bad) {
    const el = document.createElement("div");
    el.className = "toast" + (bad ? " bad" : "");
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 4200);
  }

  function sortRows(rows, key, defs) {
    const s = ui.sort[key] || defs;
    const get = s.get;
    rows.sort((a, b) => { const x = get(a), y = get(b); return (x < y ? -1 : x > y ? 1 : 0) * (s.dir || -1); });
    return rows;
  }
  function th(label, key, col, numeric = true) {
    const s = ui.sort[key];
    const on = s && s.col === col;
    return `<th class="sortable${numeric ? " num" : ""}${on ? " sorted" : ""}" data-act="sort" data-key="${key}" data-col="${col}">${label}${on ? (s.dir > 0 ? " ▲" : " ▼") : ""}</th>`;
  }

  // ---------- top bar ----------
  function renderTop() {
    const S = GM.S;
    if (!S) { $("#top").innerHTML = `<div class="topbar-inner"><span class="brand">Courtside GM</span></div>`; return; }
    const ut = GM.T(S.userTeam);
    const ranks = GM.powerRanks();
    const space = GM.capSpace(S.userTeam);
    const tabs = [
      ["dashboard", "Front office"], ["roster", "Roster"], ["trade", "Trade"], ["fa", "Free agents"], ["draft", "Draft"],
      ["standings", "Standings"], ["schedule", "Schedule"], ["leaders", "Leaders"], ["players", "Players"], ["history", "History"], ["settings", "Save & info"],
    ];
    const dot = (k) => (k === "draft" && S.phase === "draft") || (k === "fa" && S.phase === "freeagency") || (k === "roster" && S.phase === "resign") ? `<span class="dot"></span>` : "";
    $("#top").innerHTML = `
      <div class="topbar-inner">
        <div class="teamline">${badge(ut.id, true)}<div><div class="brand">${S.season} · ${phaseLabel[S.phase]}${S.phase === "regular" ? ` · day ${S.day}/${GM.lastDay()}` : ""}</div><div class="tname">${esc(ut.city)} ${esc(ut.name)}</div></div></div>
        <div class="score">
          <div class="cell"><span class="lab">Record</span><span class="val accent">${rec(ut)}</span></div>
          <div class="cell"><span class="lab">Power rank</span><span class="val">${ranks[ut.id]}<small style="font-size:.8rem;opacity:.6">/15</small></span></div>
          <div class="cell"><span class="lab">Cap space</span><span class="val" style="color:${space < 0 ? "var(--bad)" : "inherit"}">${money(space)}</span></div>
          <div class="cell"><span class="lab">Roster</span><span class="val">${GM.roster(ut.id).length}</span></div>
          ${primaryAction()}
        </div>
      </div>
      <nav class="tabs" aria-label="Sections">${tabs.map(([k, l]) => `<button class="tab" data-act="tab" data-tab="${k}" ${ui.tab === k ? 'aria-current="page"' : ""}>${l}${dot(k)}</button>`).join("")}</nav>`;
  }
  function primaryAction() {
    const S = GM.S;
    switch (S.phase) {
      case "preseason": return `<button class="btn primary" data-act="startSeason">Start ${S.season} season</button>`;
      case "regular": return `<div class="row"><button class="btn" data-act="sim" data-n="1">Sim day</button><button class="btn primary" data-act="sim" data-n="7">Sim week</button></div>`;
      case "playoffs": return S.playoffs.champion ? `<button class="btn primary" data-act="toDraft">Go to the draft</button>` : `<button class="btn primary" data-act="poRound">Sim round</button>`;
      case "draft": return `<button class="btn primary" data-act="tab" data-tab="draft">Draft room</button>`;
      case "resign": return `<button class="btn primary" data-act="toFA">Open free agency</button>`;
      case "freeagency": return `<button class="btn primary" data-act="nextSeason">Start ${S.season} preseason</button>`;
    }
    return "";
  }

  // ---------- team picker ----------
  function renderPicker() {
    const teams = GM.previewTeams().sort((a, b) => b.rating - a.rating);
    const cap = GM.data.econ.salaryCap;
    $("#view").innerHTML = `
      <section class="hero">
        <span class="eyebrow">Built on ${esc(GM.data.source)} · ${GM.data.baseSeason} season data</span>
        <h1>Take over a <em>WNBA</em> franchise</h1>
        <p>Every roster, rating and stat line starts from the real ${GM.data.baseSeason} season. Pick a team, then run it: trades, free agency, the draft, and ${GM.data.sim.games}-game seasons through the Finals. Teams are sorted by roster strength.</p>
        <p class="sub">Fan-made simulator. Not affiliated with or endorsed by the WNBA or its teams.</p>
      </section>
      <div class="pickgrid">
        ${teams.map((t) => `
          <button class="tcard" style="--tc:${t.color}" data-act="pickTeam" data-id="${t.id}">
            <div class="tt">${badge(t.id, true)}<div><b>${esc(t.city)}<br>${esc(t.name)}</b></div></div>
            <div class="meta">
              <div><span>${GM.data.baseSeason}</span><span>${t.last.w}-${t.last.l}</span></div>
              <div><span>Rating</span><span>${t.rating.toFixed(1)}</span></div>
              <div><span>Cap room</span><span>${money(cap - t.payroll)}</span></div>
            </div>
            <ul>${t.top.map((p) => `<li><span>${esc(p.name)}</span>${ovr(p.ovr)}</li>`).join("")}</ul>
          </button>`).join("")}
      </div>`;
  }

  // ---------- dashboard ----------
  function renderDashboard() {
    const S = GM.S, ut = S.userTeam, t = GM.T(ut);
    const st = GM.standings();
    const seed = st.findIndex((x) => x.id === ut) + 1;
    const rating = GM.teamRating(ut);
    const myGames = S.schedule.filter((g) => g.home === ut || g.away === ut);
    const next = myGames.find((g) => !g.played);
    const recent = myGames.filter((g) => g.played).slice(-6).reverse();
    const news = S.news.filter((n) => !ui.newsMine || n.team === ut).slice(0, 40);
    const top = GM.roster(ut).sort((a, b) => b.r.ovr - a.r.ovr).slice(0, 5);
    const pf = t.w + t.l ? (t.pf / (t.w + t.l)).toFixed(1) : "–", pa = t.w + t.l ? (t.pa / (t.w + t.l)).toFixed(1) : "–";

    $("#view").innerHTML = `
      <div class="kpis">
        <div class="kpi"><span class="eyebrow">Standing</span><span class="v">${S.phase === "preseason" ? "–" : ordinal(seed)}</span><span class="n">${S.phase === "preseason" ? `${t.last && S.season === GM.data.startSeason ? `${GM.data.baseSeason}: ${t.last.w}-${t.last.l}` : "Season not started"}` : `${rec(t)} · top 8 make the playoffs`}</span></div>
        <div class="kpi"><span class="eyebrow">Team rating</span><span class="v">${rating.toFixed(1)}</span><span class="n">Minutes-weighted OVR · ${GM.teamMode(ut) === "contend" ? "contender" : GM.teamMode(ut) === "rebuild" ? "rebuilding" : "middle of the pack"}</span></div>
        <div class="kpi"><span class="eyebrow">Payroll</span><span class="v">${money(GM.payroll(ut))}</span><span class="n">Hard cap ${money(S.econ.cap)}</span></div>
        <div class="kpi"><span class="eyebrow">Points for / against</span><span class="v">${pf}<span class="muted" style="font-size:1.1rem"> / ${pa}</span></span><span class="n">Per game</span></div>
      </div>
      ${phasePanel(next)}
      <div class="grid2">
        <section class="panel">
          <div class="panel-head"><h3>League wire</h3><label class="row sub"><input type="checkbox" id="newsMine" data-act="newsMine" ${ui.newsMine ? "checked" : ""}> Only my team</label></div>
          <div class="news">${news.map((n) => `<div class="${n.team === ut ? "mine" : ""}"><span class="when">${n.season} ${n.phase === "regular" ? "D" + n.day : (phaseLabel[n.phase] || "").slice(0, 4).toUpperCase()}</span>${esc(n.text)}</div>`).join("") || `<div class="empty">Nothing yet.</div>`}</div>
        </section>
        <div style="display:grid;gap:18px">
          <section class="panel">
            <div class="panel-head"><h3>Standings</h3><button class="btn small" data-act="tab" data-tab="standings">Full table</button></div>
            ${miniStandings(st)}
          </section>
          <section class="panel">
            <div class="panel-head"><h3>Best players</h3><button class="btn small" data-act="tab" data-tab="roster">Roster</button></div>
            <div class="tablewrap"><table><tbody>${top.map((p) => { const s = GM.perGame(p); return `<tr><td>${plink(p)}</td><td class="num">${ovr(p.r.ovr)}</td><td class="num muted">${s ? `${s.pts} / ${s.reb} / ${s.ast}` : lastLine(p)}</td></tr>`; }).join("")}</tbody></table></div>
          </section>
          ${recent.length ? `<section class="panel"><h3>Recent results</h3><div class="tablewrap"><table><tbody>${recent.map(gameRow).join("")}</tbody></table></div></section>` : ""}
        </div>
      </div>`;
  }
  const ordinal = (n) => n + (["th", "st", "nd", "rd"][(n % 100 >> 3 ^ 1) && n % 10] || "th");
  function lastLine(p) { const h = p.hist && p.hist[GM.data.baseSeason]; return h && h.gp ? `${GM.data.baseSeason}: ${f1(h.pts)} / ${f1(h.reb)} / ${f1(h.ast)}` : "–"; }
  function gameRow(g) {
    const ut = GM.S.userTeam, home = g.home === ut, opp = home ? g.away : g.home;
    if (!g.played) return `<tr><td class="muted">Day ${g.day}</td><td>${home ? "vs" : "@"} ${badge(opp)} ${esc(GM.T(opp).name)}</td><td></td></tr>`;
    const us = home ? g.hs : g.as, them = home ? g.as : g.hs;
    return `<tr><td class="muted">Day ${g.day}</td><td>${home ? "vs" : "@"} ${badge(opp)} ${esc(GM.T(opp).name)}</td><td class="num"><span class="${us > them ? "w" : "l"}">${us > them ? "W" : "L"}</span> ${us}-${them}${g.ot ? " OT" : ""} <button class="btn small" data-act="box" data-gid="${g.gid}">Box</button></td></tr>`;
  }
  function miniStandings(st) {
    const ut = GM.S.userTeam;
    return `<div class="tablewrap"><table><thead><tr><th>#</th><th>Team</th><th class="num">W-L</th><th class="num">Diff</th></tr></thead><tbody>${st.map((t, i) => {
      const gp = t.w + t.l;
      return `<tr class="${t.id === ut ? "me" : ""}${i === 7 ? " cutline" : ""}"><td class="muted">${i + 1}</td><td>${badge(t.id)} ${esc(t.name)}</td><td class="num">${rec(t)}</td><td class="num">${gp ? f1((t.pf - t.pa) / gp) : "–"}</td></tr>`;
    }).join("")}</tbody></table></div>`;
  }

  function phasePanel(next) {
    const S = GM.S, ut = S.userTeam;
    const n = GM.roster(ut).length;
    if (S.phase === "preseason") {
      const issues = [];
      if (n < S.econ.rosterMin) issues.push(`Sign ${S.econ.rosterMin - n} more player${S.econ.rosterMin - n > 1 ? "s" : ""} (minimum ${S.econ.rosterMin}).`);
      if (n > S.econ.rosterMax) issues.push(`Cut ${n - S.econ.rosterMax} player${n - S.econ.rosterMax > 1 ? "s" : ""} (maximum ${S.econ.rosterMax}).`);
      return `<section class="callout"><h3>Preseason ${S.season}</h3>
        <div class="sub">Shape the roster before opening night: trade, sign free agents, and set your rotation on the Roster tab. ${issues.length ? "" : "Your roster is legal."}</div>
        ${issues.map((x) => `<div class="chip bad">${x}</div>`).join(" ")}
        <div class="row"><button class="btn primary" data-act="startSeason">Start the season</button><button class="btn" data-act="tab" data-tab="trade">Make a trade</button><button class="btn" data-act="tab" data-tab="fa">Free agents</button></div></section>`;
    }
    if (S.phase === "regular") {
      const dl = GM.tradeDeadlineDay();
      return `<section class="callout"><div class="panel-head"><h3>Regular season · day ${S.day} of ${GM.lastDay()}</h3><span class="sub">${S.day <= dl ? `Trade deadline after day ${dl}` : "Trade deadline has passed"}</span></div>
        ${next ? `<div>Next: ${next.home === ut ? "vs" : "@"} ${badge(next.home === ut ? next.away : next.home)} <b>${esc(GM.teamName(next.home === ut ? next.away : next.home))}</b> on day ${next.day}</div>` : ""}
        <div class="row"><button class="btn" data-act="sim" data-n="1">Sim 1 day</button><button class="btn" data-act="sim" data-n="7">Sim 1 week</button>${S.day < dl ? `<button class="btn" data-act="sim" data-n="${dl - S.day}">Sim to trade deadline</button>` : ""}<button class="btn primary" data-act="sim" data-n="999">Sim to end of season</button></div></section>`;
    }
    if (S.phase === "playoffs") {
      const po = S.playoffs;
      return `<section class="callout"><div class="panel-head"><h3>${po.champion ? `${esc(GM.teamName(po.champion))} win the title` : "Playoffs"}</h3>
        ${po.champion ? `<span class="sub">Finals MVP: ${esc(GM.P(po.finalsMvp)?.name || "–")}</span>` : ""}</div>
        ${bracket()}
        ${awardsBlock(S.awards)}
        <div class="row">${po.champion ? `<button class="btn primary" data-act="toDraft">Continue to the ${S.season} draft</button>` : `<button class="btn" data-act="poGame">Sim one game</button><button class="btn" data-act="poRound">Sim round</button><button class="btn primary" data-act="poAll">Sim to champion</button>`}</div></section>`;
    }
    if (S.phase === "draft") {
      const slot = GM.draftOnClock();
      const mine = S.draft.slots.filter((s) => s.owner === ut && !s.player).map((s) => `#${s.pick}`);
      return `<section class="callout"><h3>${S.season} draft</h3><div class="sub">${slot ? `Pick ${slot.pick} on the clock: ${esc(GM.teamName(slot.owner))}.` : ""} Your remaining picks: ${mine.join(", ") || "none"}.</div>
        <div class="row"><button class="btn primary" data-act="tab" data-tab="draft">Go to the draft room</button></div></section>`;
    }
    if (S.phase === "resign") {
      const exp = GM.roster(ut).filter((p) => p.expiring || p.resign);
      return `<section class="callout"><h3>Expiring contracts</h3>
        <div class="sub">These players' deals are up. Re-sign them at their asking price or let them walk into free agency. Re-signed salaries count against next season's cap of about ${money(S.econ.cap * (1 + S.econ.growth))}.</div>
        ${exp.length ? `<div class="tablewrap"><table><thead><tr><th>Player</th><th class="num">Age</th><th class="num">OVR</th><th class="num">POT</th><th class="num">Asking</th><th></th></tr></thead><tbody>
          ${exp.map((p) => `<tr><td>${plink(p)}</td><td class="num">${p.age}</td><td class="num">${ovr(p.r.ovr)}</td><td class="num">${rt(p.r.pot)}</td><td class="num">${money(p.ask.sal)} × ${p.ask.yrs}</td><td class="num">${p.resign ? `<span class="chip good">Re-signed</span>` : p.declined ? `<span class="chip">Leaving</span>` : `<button class="btn small primary" data-act="resign" data-id="${p.id}">Re-sign</button> <button class="btn small" data-act="letgo" data-id="${p.id}">Let go</button>`}</td></tr>`).join("")}
        </tbody></table></div>` : `<div class="empty">No expiring contracts on your roster.</div>`}
        <div class="row"><button class="btn primary" data-act="toFA">Open free agency</button></div></section>`;
    }
    if (S.phase === "freeagency") {
      return `<section class="callout"><h3>Free agency · day ${S.faDay}</h3>
        <div class="sub">Make offers on the Free agents tab. Each day you advance, other teams sign players too. Cap for ${S.season}: ${money(S.econ.cap)}. You have ${n} players under contract.</div>
        <div class="row"><button class="btn" data-act="tab" data-tab="fa">Free agents</button><button class="btn" data-act="faDay">Advance one day</button><button class="btn primary" data-act="nextSeason">Start ${S.season} preseason</button></div></section>`;
    }
    return "";
  }
  function awardsBlock(a) {
    if (!a) return "";
    const item = (lab, id) => id ? `<div><span class="eyebrow">${lab}</span><div>${plink(GM.P(id))} <span class="muted">${GM.P(id).team || ""}</span></div></div>` : "";
    return `<div class="grid3">${item("MVP", a.mvp)}${item("Defensive POY", a.dpoy)}${item("Rookie of the Year", a.roy)}</div>`;
  }
  function bracket() {
    const po = GM.S.playoffs; if (!po) return "";
    const names = ["First round · best of 3", "Semifinals · best of 5", "Finals · best of 7"];
    const seed = (id) => po.seeds.indexOf(id) + 1;
    return `<div class="bracket">${[0, 1, 2].map((r) => `<div style="display:grid;gap:8px;align-content:start"><span class="eyebrow">${names[r]}</span>${(po.rounds[r] || []).map((s) => `
      <div class="series">${[[s.hi, s.wh], [s.lo, s.wl]].map(([id, w]) => `<div class="s ${s.winner ? (s.winner === id ? "win" : "lose") : ""}"><span>${badge(id)} <span class="muted">${seed(id)}</span> ${esc(GM.T(id).name)}</span><b>${w}</b></div>`).join("")}</div>`).join("") || `<div class="series muted">TBD</div>`}</div>`).join("")}</div>`;
  }

  // ---------- roster ----------
  function renderRoster() {
    const S = GM.S, ut = S.userTeam;
    const rot = GM.rotation(ut, true);
    const order = rot.map((x) => x.id);
    const mins = Object.fromEntries(rot.map((x) => [x.id, x.min]));
    const ps = GM.roster(ut);
    const all = [...order.map(GM.P), ...ps.filter((p) => !order.includes(p.id)).sort((a, b) => b.r.ovr - a.r.ovr)];
    const custom = !!GM.T(ut).rotation;
    const dead = GM.T(ut).dead.filter((d) => d.season === S.season);
    $("#view").innerHTML = `
      <section class="panel">
        <div class="panel-head"><div><h2>Roster</h2><div class="sub">${ps.length} players · payroll ${money(GM.payroll(ut))} of ${money(S.econ.cap)} · rotation is ${custom ? "custom" : "automatic (best OVR plays most)"}</div></div>
          <div class="row">${custom ? `<button class="btn" data-act="autoRot">Reset to automatic</button>` : ""}</div></div>
        <div class="sub">Use the arrows to set the rotation: the top five start, and minutes follow the order (${[34, 32, 30, 28, 26, 20, 14, 8, 5, 3].join(", ")}). Injured players sit automatically.</div>
        <div class="tablewrap"><table>
          <thead><tr><th></th><th>Player</th><th class="num">Min</th><th class="num">Age</th><th class="num">OVR</th><th class="num">POT</th><th class="num">INS</th><th class="num">3PT</th><th class="num">PLY</th><th class="num">REB</th><th class="num">DEF</th><th class="num">GP</th><th class="num">PTS</th><th class="num">REB</th><th class="num">AST</th><th class="num">Salary</th><th class="num">Yrs</th><th>Status</th><th></th></tr></thead>
          <tbody>${all.map((p, i) => {
            const s = GM.perGame(p);
            const inRot = i < order.length;
            return `<tr>
              <td><button class="btn small" data-act="rotUp" data-id="${p.id}" ${i === 0 ? "disabled" : ""} aria-label="Move up">▲</button><button class="btn small" data-act="rotDown" data-id="${p.id}" ${i === all.length - 1 ? "disabled" : ""} aria-label="Move down">▼</button></td>
              <td>${i < 5 ? `<span class="chip accent">S</span> ` : ""}${plink(p)}</td>
              <td class="num">${inRot ? Math.round(mins[p.id]) : `<span class="muted">–</span>`}</td>
              <td class="num">${p.age}</td><td class="num">${ovr(p.r.ovr)}</td><td class="num">${rt(p.r.pot)}</td>
              <td class="num">${rt(p.r.ins)}</td><td class="num">${rt(p.r.thr)}</td><td class="num">${rt(p.r.ply)}</td><td class="num">${rt(p.r.reb)}</td><td class="num">${rt(p.r.def)}</td>
              <td class="num">${s ? s.gp : "–"}</td><td class="num">${s ? s.pts : "–"}</td><td class="num">${s ? s.reb : "–"}</td><td class="num">${s ? s.ast : "–"}</td>
              <td class="num">${money(p.c.sal)}</td><td class="num">${p.c.yrs}</td>
              <td>${p.inj ? `<span class="chip bad">Out ${p.inj}g</span>` : ""}${p.expiring ? `<span class="chip warn">Expiring</span>` : ""}${p.c.rookie ? `<span class="chip">Rookie deal</span>` : ""}</td>
              <td>${ui.confirm === "rel" + p.id ? `<button class="btn small danger" data-act="release" data-id="${p.id}">Confirm release</button> <button class="btn small" data-act="cancel">Keep</button>` : `<button class="btn small" data-act="askRelease" data-id="${p.id}">Release</button>`}</td>
            </tr>`; }).join("")}</tbody>
        </table></div>
        <div class="sub">Releasing a player keeps this season's salary on your cap as dead money (half in the offseason; second- and third-round rookie deals are non-guaranteed).${dead.length ? ` Dead money this season: ${dead.map((d) => `${esc(d.name)} ${money(d.sal)}`).join(", ")}.` : ""}</div>
      </section>`;
  }
  function moveRot(id, dir) {
    const ut = GM.S.userTeam;
    const rot = GM.rotation(ut, true).map((x) => x.id);
    const rest = GM.roster(ut).filter((p) => !rot.includes(p.id)).sort((a, b) => b.r.ovr - a.r.ovr).map((p) => p.id);
    const all = rot.concat(rest);
    const i = all.indexOf(id), j = i + dir;
    if (i < 0 || j < 0 || j >= all.length) return;
    [all[i], all[j]] = [all[j], all[i]];
    GM.setRotation(all);
  }

  // ---------- player modal ----------
  function playerModal(id) {
    const S = GM.S, p = GM.P(id); if (!p) return "";
    const t = GM.T(p.team);
    const s = GM.perGame(p);
    const bars = [["OVR", p.r.ovr, "Overall"], ["POT", p.r.pot, "Potential"], ["INS", p.r.ins, "Inside scoring"], ["3PT", p.r.thr, "3-point shooting"], ["FT", p.r.fts, "Free throws"], ["PLY", p.r.ply, "Playmaking"], ["REB", p.r.reb, "Rebounding"], ["DEF", p.r.def, "Defense"], ["ATH", p.r.ath, "Athleticism"]];
    const base = p.last || (p.hist && p.hist[GM.data.baseSeason]);
    const career = [];
    const realSeasons = Object.keys(p.hist || {}).map(Number).sort((x, y) => x - y);
    for (const yr of realSeasons) { const h = p.hist[yr]; if (h && h.gp) career.push({ season: yr, team: h.team || "–", gp: h.gp, min: h.min, pts: h.pts, reb: h.reb, ast: h.ast, stl: h.stl, blk: h.blk, fg: h.fg_pct, tp: h.fg3_pct, ft: h.ft_pct, real: true }); }
    for (const c of p.career) career.push(c);
    if (s) career.push({ season: S.season, ...s, cur: true });
    if (career.length > 1) {
      const g = career.reduce((t, c) => t + c.gp, 0);
      const avg = (k) => career.reduce((t, c) => t + (c[k] || 0) * c.gp, 0) / g;
      career.push({ season: "Career", team: `${career.length} seasons`, gp: g, min: avg("min"), pts: avg("pts"), reb: avg("reb"), ast: avg("ast"), stl: avg("stl"), blk: avg("blk"), fg: avg("fg"), tp: avg("tp"), ft: avg("ft"), total: true });
    }
    const isMine = p.team === S.userTeam;
    const scouted = p.prospect && p.scout;
    let actions = "";
    if (isMine) actions = `<button class="btn" data-act="tab" data-tab="roster">Manage on roster</button>`;
    else if (p.team && GM.tradesOpen()) actions = `<button class="btn primary" data-act="tradeFor" data-id="${p.id}">Trade for her</button>`;
    else if (!p.team && !p.prospect && !p.retired) actions = `<button class="btn primary" data-act="offerFrom" data-id="${p.id}">Make an offer</button>`;
    return `<div class="modal-bg" data-act="closeModal"><div class="modal" style="--tc:${t ? t.color : "var(--tier-4)"}" role="dialog" aria-modal="true" aria-label="${esc(p.name)}" data-stop>
      <div class="modal-head"><div class="row">${badge(p.team, true)}<div><h2>${esc(p.name)}</h2><div class="sub">${esc(p.pos)} · ${ht(p.ht)} · age ${p.age} · ${p.exp ? `${p.exp} yrs exp` : "rookie"}${p.school ? ` · ${esc(p.school)}` : ""}</div></div></div><button class="btn" data-act="closeModal">Close</button></div>
      <div class="row">${t ? `<span class="chip">${esc(t.city)} ${esc(t.name)}</span>` : p.retired ? `<span class="chip">Retired ${p.retired}</span>` : p.prospect ? `<span class="chip accent">${p.prospect} draft prospect</span>` : `<span class="chip warn">Free agent${p.ask ? ` · asking ${money(p.ask.sal)} × ${p.ask.yrs}` : ""}</span>`}
        ${p.team ? `<span class="chip">${money(p.c.sal)} × ${p.c.yrs} yr${p.c.yrs === 1 ? "" : "s"}</span>` : ""}${p.inj ? `<span class="chip bad">${esc(p.injType)} · out ${p.inj} games</span>` : ""}${p.acq ? `<span class="chip">${esc(p.acq)}</span>` : ""}${p.real ? "" : `<span class="chip">Generated player</span>`}</div>
      ${scouted ? `<div class="callout"><b>Scouting report</b><div>Your scouts project her at ${ovr(p.scout.ovr)} now with a ceiling around ${rt(p.scout.pot)}. Estimates carry a few points of error either way.</div></div>`
        : `<div class="bars">${bars.map(([l, v, full]) => `<div class="bar" title="${full}"><span class="eyebrow">${l}</span><div class="track"><div class="fill" style="width:${v}%"></div></div><b>${v}</b></div>`).join("")}</div>`}
      ${career.length ? `<div class="tablewrap" style="max-height:340px;overflow-y:auto"><table><thead><tr><th>Season</th><th>Team</th><th class="num">GP</th><th class="num">MIN</th><th class="num">PTS</th><th class="num">REB</th><th class="num">AST</th><th class="num">STL</th><th class="num">BLK</th><th class="num">FG%</th><th class="num">3P%</th><th class="num">FT%</th></tr></thead><tbody>
        ${career.map((c) => `<tr${c.total ? ' style="font-weight:700"' : ""}><td>${c.season}${c.real ? ' <span class="chip">real</span>' : c.cur ? ' <span class="chip accent">now</span>' : ""}</td><td>${esc(c.team)}</td><td class="num">${c.gp}</td><td class="num">${f1(c.min)}</td><td class="num">${f1(c.pts)}</td><td class="num">${f1(c.reb)}</td><td class="num">${f1(c.ast)}</td><td class="num">${f1(c.stl)}</td><td class="num">${f1(c.blk)}</td><td class="num">${pct(c.fg)}</td><td class="num">${pct(c.tp)}</td><td class="num">${pct(c.ft)}</td></tr>`).join("")}
      </tbody></table></div>` : `<div class="empty">No WNBA stats yet.</div>`}
      ${base && base.bpm != null ? `<div class="sub">${GM.data.baseSeason} impact: BPM ${f1(base.bpm)} · WAR ${base.war ?? "–"} · TS% ${pct(base.ts)}</div>` : ""}
      <div class="row">${actions}</div>
    </div></div>`;
  }

  function boxModal(gid) {
    const b = GM.S.boxes[gid]; if (!b) return "";
    const tbl = (tid) => `<h3>${badge(tid)} ${esc(GM.teamName(tid))} · ${tid === b.home ? b.hs : b.as}</h3><div class="tablewrap"><table><thead><tr><th>Player</th><th class="num">MIN</th><th class="num">PTS</th><th class="num">REB</th><th class="num">AST</th><th class="num">STL</th><th class="num">BLK</th><th class="num">TO</th><th class="num">FG</th><th class="num">3PT</th><th class="num">FT</th></tr></thead><tbody>
      ${b.players[tid].map((l) => { const p = GM.P(l.id); return `<tr><td>${l.start ? "" : '<span class="muted">· </span>'}${p ? plink(p) : "–"}</td><td class="num">${l.min}</td><td class="num"><b>${l.pts}</b></td><td class="num">${l.reb}</td><td class="num">${l.ast}</td><td class="num">${l.stl}</td><td class="num">${l.blk}</td><td class="num">${l.tov}</td><td class="num">${l.fgm}-${l.fga}</td><td class="num">${l.tpm}-${l.tpa}</td><td class="num">${l.ftm}-${l.fta}</td></tr>`; }).join("")}</tbody></table></div>`;
    return `<div class="modal-bg" data-act="closeModal"><div class="modal" role="dialog" aria-modal="true" aria-label="Box score" data-stop>
      <div class="modal-head"><h2>${esc(GM.T(b.away).name)} ${b.as} @ ${esc(GM.T(b.home).name)} ${b.hs}${b.ot ? ` (${b.ot > 1 ? b.ot : ""}OT)` : ""}</h2><button class="btn" data-act="closeModal">Close</button></div>
      ${tbl(b.away)}${tbl(b.home)}</div></div>`;
  }

  // ---------- trade ----------
  function renderTrade() {
    const S = GM.S, ut = S.userTeam, tr = ui.trade;
    const others = S.teams.filter((t) => t.id !== ut);
    if (!tr.partner) tr.partner = others[0].id;
    const partner = tr.partner;
    const mode = GM.teamMode(partner);
    const ev = GM.evaluateTrade(partner, [...tr.give], [...tr.get], [...tr.givePicks], [...tr.getPicks]);
    const sal = (ids) => [...ids].reduce((s, id) => s + GM.P(id).c.sal, 0);
    const pickList = (owner, set, side) => S.picks.map((pk, k) => ({ pk, k })).filter((x) => x.pk.owner === owner)
      .map(({ pk, k }) => `<label class="pickrow ${set.has(k) ? "on" : ""}"><input type="checkbox" data-act="tpick" data-side="${side}" data-k="${k}" ${set.has(k) ? "checked" : ""}><span class="grow">${esc(GM.pickLabel(pk))}</span></label>`).join("");
    const playerList = (tid, set, side) => GM.roster(tid).sort((a, b) => b.r.ovr - a.r.ovr).map((p) => `
      <label class="pickrow ${set.has(p.id) ? "on" : ""}"><input type="checkbox" data-act="tsel" data-side="${side}" data-id="${p.id}" ${set.has(p.id) ? "checked" : ""}>
      ${ovr(p.r.ovr)}<span class="grow"><b>${esc(p.name)}</b> <span class="pos">${esc(p.pos)} · ${p.age}y · pot ${p.r.pot}${p.inj ? " · injured" : ""}</span></span><span class="muted">${money(p.c.sal)}×${p.c.yrs}</span></label>`).join("");
    const ratio = Math.min(1.5, ev.ratio);
    const color = ev.ratio >= 1 ? "var(--good)" : ev.ratio >= 0.8 ? "var(--warn)" : "var(--bad)";
    const verdict = ev.ratio >= 1 ? "They'd take this deal." : ev.ratio >= 0.85 ? "Close. They want a bit more." : ev.ratio >= 0.6 ? "Not enough value for them." : "They'd hang up on this.";
    $("#view").innerHTML = `
      <section class="panel">
        <div class="panel-head"><div><h2>Trade</h2><div class="sub">${GM.tradesOpen() ? (S.phase === "regular" ? `Deadline after day ${GM.tradeDeadlineDay()}.` : "Trades are open.") : "Trades are closed right now."} Hard cap: both teams must stay under ${money(S.econ.cap)} unless the deal lowers their payroll.</div></div>
          <label class="row">Trade partner <select id="partner" data-act="partner">${others.map((t) => `<option value="${t.id}" ${t.id === partner ? "selected" : ""}>${esc(t.city)} ${esc(t.name)} (${rec(t)})</option>`).join("")}</select></label></div>
        <div class="callout">
          <div class="panel-head"><b>${verdict}</b><span class="sub">${esc(GM.T(partner).name)} are ${mode === "contend" ? "contending: they value current production" : mode === "rebuild" ? "rebuilding: they value youth, potential and picks" : "in the middle: they value overall talent"}</span></div>
          <div class="meter" aria-label="Trade value meter"><div class="fill" style="width:${(ratio / 1.5) * 100}%;background:${color}"></div><div class="mark" title="Acceptance line"></div></div>
          <div class="row sub"><span>You send ${money(sal(tr.give))}</span>·<span>You take back ${money(sal(tr.get))}</span>·<span>Your payroll after: ${money(GM.payroll(ut) - sal(tr.give) + sal(tr.get))}</span></div>
          ${ev.issues.map((x) => `<div class="chip bad">${esc(x)}</div>`).join(" ")}
          ${tr.msg ? `<div>${esc(tr.msg)}</div>` : ""}
          <div class="row"><button class="btn primary" data-act="propose" ${ev.issues.length ? "disabled" : ""}>Propose trade</button><button class="btn" data-act="balance">What would make this work?</button><button class="btn" data-act="clearTrade">Clear</button></div>
        </div>
        <div class="tradecols">
          <div style="display:grid;gap:6px;min-width:0"><h3>You give · ${esc(GM.T(ut).name)}</h3>${playerList(ut, tr.give, "give")}<span class="eyebrow" style="margin-top:8px">Draft picks</span>${pickList(ut, tr.givePicks, "give") || `<div class="empty">No picks.</div>`}</div>
          <div style="display:grid;gap:6px;min-width:0"><h3>You get · ${esc(GM.T(partner).name)}</h3>${playerList(partner, tr.get, "get")}<span class="eyebrow" style="margin-top:8px">Draft picks</span>${pickList(partner, tr.getPicks, "get") || `<div class="empty">No picks.</div>`}</div>
        </div>
      </section>
      ${S.tradeLog.length ? `<section class="panel"><h3>Your trade history</h3>${S.tradeLog.slice(0, 15).map((x) => `<div class="sub">${x.season}: ${esc(x.text)}</div>`).join("")}</section>` : ""}`;
  }

  // ---------- free agents ----------
  function renderFA() {
    const S = GM.S, ut = S.userTeam;

    sortRows(fas, "fa", { col: "ovr", dir: -1, get: (p) => p.r.ovr });
    const space = GM.capSpace(ut), n = GM.roster(ut).length;
    $("#view").innerHTML = `
      <section class="panel">
        <div class="panel-head"><div><h2>Free agents</h2><div class="sub">${fas.length} available · your cap space ${money(space)} · roster ${n}/${S.econ.rosterMax}. Minimum deals (${money(S.econ.min)}) are allowed over the cap while you're below ${S.econ.rosterMin} players.</div></div>
          ${S.phase === "freeagency" ? `<button class="btn" data-act="faDay">Advance one day</button>` : ""}</div>
        <div class="tablewrap"><table>
          <thead><tr><th>Player</th>${th("Age", "fa", "age")}${th("OVR", "fa", "ovr")}${th("POT", "fa", "pot")}<th class="num">INS</th><th class="num">3PT</th><th class="num">PLY</th><th class="num">REB</th><th class="num">DEF</th>${th("Asking", "fa", "ask")}<th></th></tr></thead>
          <tbody>${fas.slice(0, 120).map((p) => {
            const ask = p.ask || { sal: S.econ.min, yrs: 1 };
