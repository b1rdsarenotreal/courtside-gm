<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Courtside Commissioner</title>
<meta name="description" content="A WNBA commissioner simulator that starts in any season from 1997 to 2026, built on wehoop WNBA Stats data.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: navy sidebar (league nav) + light content column with a frosted sticky top bar; content is a grid of soft cards. */
:root {
  --bg: #f3f4f8;
  --surface: #ffffff;
  --surface-2: #f6f7fb;
  --surface-3: #eceff6;
  --ink: #121629;
  --muted: #646b80;
  --line: #e4e7ef;
  --line-strong: #d2d7e3;
  --accent: #e8571c;
  --accent-2: #ff8a50;
  --accent-soft: #fdebe2;
  --accent-ink: #ffffff;
  --court: #0f1733;
  --court-2: #1a2449;
  --court-ink: #eef1fa;
  --court-muted: #8f9bc0;
  --good: #1d8152;
  --bad: #c2372c;
  --warn: #a8691a;
  --gold: #b7862b;
  --gold-soft: #f8efd9;
  --tier-1: #e8571c;
  --tier-2: #2d6cdf;
  --tier-3: #3f8f6a;
  --tier-4: #8a90a3;
  --shadow: 0 1px 2px rgba(16, 22, 45, 0.05), 0 4px 18px rgba(16, 22, 45, 0.05);
  --shadow-lg: 0 10px 40px rgba(10, 14, 30, 0.22);
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Archivo", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --radius: 14px;
  --radius-sm: 9px;
  --gutter: clamp(16px, 2.4vw, 36px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0e1a; --surface: #141a2b; --surface-2: #19203a; --surface-3: #212a48; --ink: #e9ecf5; --muted: #9aa2bb; --line: #252e4d; --line-strong: #323c60;
    --accent: #ff7a45; --accent-2: #ffa070; --accent-soft: #3a2218; --accent-ink: #1a0d06; --court: #070a15; --court-2: #121a33; --court-ink: #eef1fa; --court-muted: #8791b3;
    --good: #45c08a; --bad: #ff6b5e; --warn: #e3a64a; --gold: #e6bb62; --gold-soft: #33290f;
    --tier-1: #ff7a45; --tier-2: #6b9bff; --tier-3: #5cc095; --tier-4: #8b92aa;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 18px rgba(0, 0, 0, 0.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0e1a; --surface: #141a2b; --surface-2: #19203a; --surface-3: #212a48; --ink: #e9ecf5; --muted: #9aa2bb; --line: #252e4d; --line-strong: #323c60;
  --accent: #ff7a45; --accent-2: #ffa070; --accent-soft: #3a2218; --accent-ink: #1a0d06; --court: #070a15; --court-2: #121a33; --court-ink: #eef1fa; --court-muted: #8791b3;
  --good: #45c08a; --bad: #ff6b5e; --warn: #e3a64a; --gold: #e6bb62; --gold-soft: #33290f;
  --tier-1: #ff7a45; --tier-2: #6b9bff; --tier-3: #5cc095; --tier-4: #8b92aa;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 18px rgba(0, 0, 0, 0.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { margin: 0; font-family: var(--font-body); font-size: 14px; line-height: 1.5; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
a { color: var(--accent); }
h1, h2, h3 { margin: 0; line-height: 1.1; text-wrap: balance; }
h1, h2 { font-family: var(--font-display); font-weight: 700; letter-spacing: 0.01em; text-transform: uppercase; }
h2 { font-size: 1.55rem; }
h3 { font-family: var(--font-body); font-size: 0.98rem; font-weight: 700; letter-spacing: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; }
.main-col { min-width: 0; display: flex; flex-direction: column; }
.side {
  position: sticky; top: 0; height: 100vh; overflow-y: auto; scrollbar-width: thin;
  background: linear-gradient(180deg, var(--court) 0%, var(--court-2) 100%); color: var(--court-ink);
  padding: 18px 14px 24px; display: flex; flex-direction: column; gap: 18px;
}
.brandbox { display: flex; align-items: center; gap: 10px; padding: 2px 6px; }
.brandbox b { display: block; font-family: var(--font-display); font-size: 1.35rem; letter-spacing: 0.06em; text-transform: uppercase; line-height: 1; }
.brandbox > div > span { display: block; font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--court-muted); }
.mark { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; font-family: var(--font-display); font-weight: 700; font-size: 1.4rem; box-shadow: 0 4px 14px rgba(232, 87, 28, 0.35); flex: none; }
.seasoncard { background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px; padding: 12px; display: grid; gap: 8px; font-size: 0.8rem; color: var(--court-muted); }
.seasoncard b { font-family: var(--font-display); font-size: 1.6rem; color: var(--court-ink); line-height: 1; }
.phase { font-size: 0.7rem; font-weight: 600; padding: 3px 8px; border-radius: 99px; background: rgba(255, 255, 255, 0.1); color: var(--court-ink); }
.phase.regular { background: rgba(69, 192, 138, 0.18); color: #7fe0b2; }
.phase.playoffs { background: rgba(255, 122, 69, 0.22); color: #ffb08a; }
.prog { height: 5px; border-radius: 9px; background: rgba(255, 255, 255, 0.1); overflow: hidden; }
.prog div { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius: 9px; }
.nav { display: grid; gap: 14px; }
.navgroup { display: grid; gap: 2px; }
.navlabel { font-size: 0.66rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--court-muted); padding: 0 10px 4px; opacity: 0.8; }
.navitem { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: 0; border-radius: 9px; background: none; color: var(--court-muted); font-weight: 500; font-size: 0.9rem; cursor: pointer; text-align: left; transition: background 0.15s, color 0.15s; }
.navitem:hover { background: rgba(255, 255, 255, 0.06); color: var(--court-ink); }
.navitem[aria-current="page"] { background: rgba(255, 255, 255, 0.1); color: #fff; box-shadow: inset 3px 0 0 var(--accent); }
.navitem .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-left: auto; box-shadow: 0 0 0 3px rgba(232, 87, 28, 0.25); }
.ico { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px);
  border-bottom: 1px solid var(--line); padding: 14px var(--gutter);
  display: flex; gap: 14px 20px; align-items: center; flex-wrap: wrap;
}
.top-title { display: grid; gap: 2px; min-width: 0; }
.top-title h1 { font-size: 1.85rem; line-height: 1; }
.top-stats { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; align-items: center; }
.stat { display: inline-flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 99px; padding: 4px 11px 4px 8px; font-size: 0.8rem; color: var(--muted); box-shadow: var(--shadow); }
.stat b { color: var(--ink); font-family: var(--font-display); font-size: 1.05rem; }
.top-actions { display: flex; gap: 8px; }

main { padding: 20px var(--gutter) 64px; display: grid; gap: 18px; align-content: start; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.grid2 > *, .grid3 > * { min-width: 0; }

@media (max-width: 960px) {
  .app { display: block; }
  .side { position: sticky; top: 0; z-index: 30; height: auto; flex-direction: row; align-items: center; gap: 10px; padding: 10px 12px; overflow-x: auto; overflow-y: hidden; }
  .brandbox > div > span, .seasoncard, .navlabel { display: none; }
  .brandbox b { font-size: 1.1rem; }
  .mark { width: 30px; height: 30px; font-size: 1.1rem; }
  .nav { display: flex; gap: 2px; }
  .navgroup { display: contents; }
  .navitem { white-space: nowrap; padding: 7px 10px; }
  .navitem[aria-current="page"] { box-shadow: inset 0 -2px 0 var(--accent); }
  .topbar { top: 54px; }
  .top-stats { margin-left: 0; }
  .grid2, .grid3 { grid-template-columns: minmax(0, 1fr); }
}

/* ---------- cards ---------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: grid; gap: 14px; min-width: 0; box-shadow: var(--shadow); }
.panel-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.sub { color: var(--muted); font-size: 0.85rem; }
.eyebrow { font-size: 0.68rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.spacer { flex: 1; }
.callout { background: linear-gradient(135deg, var(--surface) 0%, var(--surface-2) 100%); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: grid; gap: 12px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
.callout::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; background: linear-gradient(180deg, var(--accent), var(--accent-2)); }
.callout h3 { font-family: var(--font-display); font-size: 1.35rem; text-transform: uppercase; letter-spacing: 0.02em; }
.empty { color: var(--muted); padding: 14px 0; }

/* ---------- controls ---------- */
.btn { border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); padding: 8px 14px; border-radius: var(--radius-sm); cursor: pointer; font-weight: 600; font-size: 0.86rem; white-space: nowrap; transition: border-color 0.15s, background 0.15s, transform 0.05s, box-shadow 0.15s; }
.btn:hover { border-color: var(--muted); background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); border-color: transparent; color: #fff; box-shadow: 0 4px 14px rgba(232, 87, 28, 0.28); }
.btn.primary:hover { filter: brightness(1.05); box-shadow: 0 6px 18px rgba(232, 87, 28, 0.36); }
.btn.danger { color: var(--bad); }
.btn.small { padding: 4px 10px; font-size: 0.76rem; border-radius: 7px; }
.btn.ghost { background: transparent; border-color: var(--line); color: var(--muted); }
.btn.ghost:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.seg { display: inline-flex; gap: 2px; background: var(--surface-3); padding: 3px; border-radius: 11px; justify-self: start; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 6px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.84rem; color: var(--muted); }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
select, input[type="number"], input[type="text"], input[type="search"] { background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius-sm); padding: 7px 10px; min-width: 0; }
select:hover, input:hover { border-color: var(--muted); }
input[type="number"] { width: 110px; }
input[type="checkbox"], input[type="range"] { accent-color: var(--accent); }

/* ---------- stats & tables ---------- */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 700px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 2px; box-shadow: var(--shadow); }
.kpi .v { font-family: var(--font-display); font-size: 2rem; font-weight: 700; line-height: 1; }
.kpi .n { color: var(--muted); font-size: 0.8rem; }

.tablewrap { overflow-x: auto; margin-inline: -4px; }
table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 0.86rem; }
th { text-align: left; font-size: 0.68rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface-2); }
th:first-child { border-top-left-radius: 8px; } th:last-child { border-top-right-radius: 8px; }
th.sortable { cursor: pointer; }
th.sortable:hover, th.sorted { color: var(--ink); }
td { padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
tbody tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; }
tr.me td { background: var(--accent-soft); }
tr.cutline td { border-bottom: 2px dashed var(--accent); }
tbody tr:hover td { background: var(--surface-2); }
tr.me:hover td { background: var(--accent-soft); }
.plink { background: none; border: 0; padding: 0; cursor: pointer; font-weight: 600; text-align: left; color: var(--ink); }
.plink:hover { color: var(--accent); }
.pos { color: var(--muted); font-size: 0.74rem; margin-left: 4px; }
.ovr { display: inline-grid; place-items: center; min-width: 30px; padding: 2px 6px; border-radius: 7px; font-weight: 700; font-family: var(--font-display); font-size: 1rem; color: #fff; }
.ovr.t1 { background: linear-gradient(135deg, var(--tier-1), var(--accent-2)); } .ovr.t2 { background: var(--tier-2); } .ovr.t3 { background: var(--tier-3); } .ovr.t4 { background: var(--tier-4); }
.rt { font-weight: 600; }
.rt.hi { color: var(--tier-1); } .rt.mid { color: var(--ink); } .rt.lo { color: var(--muted); }
.badge { display: inline-grid; place-items: center; width: 34px; height: 24px; border-radius: 6px; font-family: var(--font-display); font-weight: 700; font-size: 0.85rem; color: #fff; letter-spacing: 0.04em; flex: none; vertical-align: middle; box-shadow: inset 0 -1px 0 rgba(0, 0, 0, 0.15); }
.badge.big { width: 54px; height: 40px; font-size: 1.25rem; border-radius: 9px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 99px; font-size: 0.72rem; font-weight: 600; background: var(--surface-3); color: var(--muted); border: 0; }
.chip.good { color: var(--good); background: color-mix(in srgb, var(--good) 12%, transparent); }
.chip.bad { color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, transparent); }
.chip.warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }
.chip.accent { color: var(--accent); background: var(--accent-soft); }
.w { color: var(--good); font-weight: 700; } .l { color: var(--bad); font-weight: 700; }
.muted { color: var(--muted); }

/* rating bars */
.bars { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px 18px; }
.bar { display: grid; grid-template-columns: 34px 1fr 26px; gap: 8px; align-items: center; font-size: 0.8rem; }
.bar .track { height: 7px; background: var(--surface-3); border-radius: 9px; overflow: hidden; }
.bar .fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius: 9px; }

/* news */
.news { display: grid; gap: 0; max-height: 460px; overflow-y: auto; }
.news div { padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 0.86rem; }
.news .when { font-family: var(--font-mono); font-size: 0.66rem; color: var(--muted); margin-right: 8px; background: var(--surface-3); padding: 1px 6px; border-radius: 5px; }
.news .mine { color: var(--accent); font-weight: 600; }

/* new league */
.hero { display: grid; gap: 12px; padding-block: 10px 4px; }
.hero h1 { font-size: clamp(2.6rem, 6vw, 4.6rem); }
.hero h1 em { font-style: normal; background: linear-gradient(135deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero p { max-width: 64ch; color: var(--muted); margin: 0; font-size: 1rem; }
.pickgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.tcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 12px; cursor: pointer; text-align: left; box-shadow: var(--shadow); position: relative; overflow: hidden; transition: transform 0.15s, box-shadow 0.15s; }
.tcard::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 4px; background: var(--tc, var(--accent)); }
.tcard:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(16, 22, 45, 0.1); }
.tcard .tt { display: flex; gap: 12px; align-items: center; }
.tcard .tt b { font-family: var(--font-display); font-size: 1.3rem; text-transform: uppercase; line-height: 1; }
.tcard .meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: var(--surface-2); border-radius: 10px; padding: 8px 10px; }
.tcard .meta div { display: grid; }
.tcard .meta span:first-child { font-size: 0.62rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.tcard .meta span:last-child { font-family: var(--font-display); font-size: 1.2rem; font-weight: 700; }
.tcard ul { margin: 0; padding: 0; list-style: none; font-size: 0.84rem; display: grid; gap: 4px; }
.tcard li { display: flex; justify-content: space-between; gap: 8px; align-items: center; }

/* schedule */
.dayblock { border-top: 1px solid var(--line); padding-top: 6px; }
.dayblock summary { cursor: pointer; font-weight: 600; font-size: 0.86rem; padding: 6px 2px; list-style-position: inside; }
table.games td { padding: 7px 8px; }
.score-cell { font-family: var(--font-display); font-size: 1.1rem; width: 48px; }
td.at { width: 24px; text-align: center; }
.series-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 1100px) { .series-grid { grid-template-columns: minmax(0, 1fr); } }
.series-card { border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: grid; gap: 8px; background: var(--surface-2); }
.sc-team { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 9px; background: var(--surface); }
.sc-team.win { font-weight: 700; box-shadow: inset 3px 0 0 var(--accent); }
.sc-team.lose { color: var(--muted); }
.sc-team.lose .badge, .sc-team.lose .logo { opacity: 0.5; }
.sc-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sc-w { font-family: var(--font-display); font-size: 1.3rem; }
.sc-games { display: grid; gap: 4px; margin-top: 4px; }
.sc-game { display: flex; align-items: center; gap: 10px; padding: 5px 4px; border-top: 1px solid var(--line); font-size: 0.85rem; flex-wrap: wrap; }
.sc-g { width: 26px; font-weight: 600; }
.sc-side { display: inline-flex; align-items: center; gap: 6px; }
.sc-side b { font-family: var(--font-display); font-size: 1.05rem; }

/* bracket summary list (office) */
.bracket { display: grid; grid-template-columns: repeat(3, minmax(170px, 1fr)); gap: 14px; overflow-x: auto; }
.series { border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 8px 10px; display: grid; gap: 4px; background: var(--surface-2); font-size: 0.86rem; }
.series .s { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.series .s.win { font-weight: 700; }
.series .s.lose { color: var(--muted); }

/* box score */
.modal.wide { width: min(1120px, 100%); }
.scoreline { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; font-family: var(--font-display); font-size: 1.7rem; font-weight: 700; text-transform: uppercase; margin-top: 4px; }
.scoreline span { display: inline-flex; align-items: center; gap: 10px; }
.box-top { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 800px) { .box-top { grid-template-columns: minmax(0, 1fr); } }
table.linescore td, table.linescore th { padding: 7px 10px; }
.compare { border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 10px 12px; display: grid; gap: 2px; background: var(--surface-2); font-size: 0.84rem; }
.cmp-head, .cmp-row { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; }
.cmp-head { font-weight: 700; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.cmp-head span:first-child, .cmp-row span:first-child { text-align: left; }
.cmp-head span:last-child, .cmp-row span:last-child { text-align: right; }
.cmp-head span:nth-child(2), .cmp-row span:nth-child(2) { text-align: center; font-size: 0.76rem; }

.award-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
.award-tile { background: var(--surface-2); border: 1px solid var(--line); border-radius: 11px; padding: 10px 12px; display: grid; gap: 3px; }
.award-tile:first-child { background: var(--gold-soft); border-color: color-mix(in srgb, var(--gold) 35%, transparent); }
.team-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.team-list { display: grid; gap: 4px; align-content: start; }

/* records */
.rec-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); gap: 14px; }

textarea { width: 100%; min-height: 90px; font-family: var(--font-mono); font-size: 0.75rem; background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 8px; }

.bk-wrap { overflow-x: auto; padding-bottom: 6px; }

.bk-row { display: flex; align-items: center; gap: 6px; padding: 0 9px; font-size: 0.84rem; min-width: 0; width: 100%; background: none; border: 0; text-align: left; color: inherit; cursor: pointer; }

// Courtside commissioner engine: an alternate-history WNBA that starts in any

  // ---------- awards ----------
  function perGame(p, season = S.season, po = false) {

  // Individual production per game, scaled to the era's scoring level.
  function indScore(s) {
    if (!s) return 0;

  }

  }
  function computeAwards() {

    // generated players are considered for it.
    const allRows = Object.values(S.players).filter((p) => p.team && !p.retired).map((p) => ({ p, s: perGame(p) })).filter((x) => x.s);
    const realRows = genCapOn() ? allRows.filter((x) => x.p.real) : allRows;

  // Season and career leaderboards: real seasons before the league's start

      const l = rp.s[ys];

    const qualified = lines.filter((l) => l.gp >= (gamesIn[l.season] || 34) * 0.5);
    const top = (arr, k, n = 10) => arr.slice().sort((a, b) => b[k] - a[k]).slice(0, n);

  // ---------- history events ----------
  function queueHistoryEvents(y) {
    if (!D.teams[y] || !D.teams[y - 1]) return;
    const prev = Object.fromEntries(D.teams[y - 1].map((t) => [t.fid, t]));
    const cur = Object.fromEntries(D.teams[y].map((t) => [t.fid, t]));
    const add = (e) => { if (S.events.some((x) => x.id === `${y}-${e.type}-${e.fid}`)) return; S.events.push({ id: `${y}-${e.type}-${e.fid}`, season: y, approved: true, done: false, ...e }); };
    for (const fid in cur) if (!prev[fid]) add({ type: "expand", fid, team: cur[fid], text: `${cur[fid].city} ${cur[fid].name} join the league` });
    for (const fid in prev) if (!cur[fid]) add({ type: "fold", fid, text: `${prev[fid].city} ${prev[fid].name} fold` });
    for (const fid in cur) if (prev[fid] && (prev[fid].city !== cur[fid].city || prev[fid].name !== cur[fid].name))
      add({ type: "relocate", fid, team: cur[fid], text: `${prev[fid].city} ${prev[fid].name} become the ${cur[fid].city} ${cur[fid].name}` });
    const g0 = D.league[y - 1].games, g1 = D.league[y].games;
    if (g0 !== g1) add({ type: "games", fid: "L", games: g1, text: `Regular season changes from ${g0} to ${g1} games` });
  }
  const pendingEvents = () => S.events.filter((e) => e.season === S.season + 1 && !e.done);
  function setEventApproval(id, ok) { const e = S.events.find((x) => x.id === id); if (e) { e.approved = ok; save(); } }
  function applyHistoryEvents() {
    for (const e of pendingEvents()) {
      e.done = true;
      if (!e.approved) { log(`Commissioner vetoed: ${e.text} (${e.season}).`, null, "office"); continue; }
      const t = T(e.fid);
      if (e.type === "expand") {
        if (t && t.active) continue;
        const conf = S.conferences.includes(e.team.conf) ? e.team.conf : smallestConf();
        expandTeam({ fid: e.fid, abbr: e.team.abbr, city: e.team.city, name: e.team.name, color: e.team.color, conf }, true);
      } else if (e.type === "fold") { if (t && t.active) foldTeam(e.fid, true); }

  }
  const smallestConf = () => S.conferences.slice().sort((a, b) => activeTeams().filter((t) => t.conf === a).length - activeTeams().filter((t) => t.conf === b).length)[0];

  // ---------- commissioner powers ----------
  const officeOpen = () => S.phase === "preseason" || S.phase === "offseason";
  function setRules(patch) {
    const r = { ...(S.phase === "regular" || S.phase === "playoffs" ? (S.rulesNext || S.rules) : S.rules), ...patch };
    const n = activeTeams().length;
    r.playoffTeams = clamp(Math.round(r.playoffTeams), 2, Math.max(2, n));
    r.games = clamp(Math.round(r.games), 4, 100);
    r.rosterMin = clamp(Math.round(r.rosterMin), 8, 20); r.rosterMax = clamp(Math.round(r.rosterMax), r.rosterMin, 20);
    r.draftRounds = clamp(Math.round(r.draftRounds), 0, 6);

  function addConference(name) {

  }

  }
  function removeConference(c) {

  function expandTeam(info, fromHistory) {

  function foldTeam(fid, fromHistory) {
    if (!fromHistory && !officeOpen()) return { ok: false, msg: "Teams can only fold in the preseason or offseason." };

    const t = T(fid); t.active = false; t.folded = S.season;

    log(`${fromHistory ? "" : "Commissioner's decision: "}the ${t.city} ${t.name} fold. Their ${pool.length} players go to a dispersal draft.`, fid, "office");
    // Dispersal draft: worst teams pick first; teams pass when the player wouldn't help.

  }

  // ---------- offseason ----------
  function toOffseason() {
    if (S.phase !== "playoffs" || !S.playoffs.champion) return;

  // Run everything between seasons: history events, draft, re-signings, free agency, development.

    S.playoffs = null; S.awards = null; S.boxes = {}; S.schedule = []; S.day = 0;
    pruneSave();
    S.phase = "preseason";

    save();

  }

  // Draft: real players whose WNBA debut is next season enter, plus generated prospects.
  function draftClass(y) {
    const out = [];
    if (y <= LAST_REAL) {
      for (const rp of D.players) {
        if (!rp.s[y] || S.players[rp.id]) continue;
        const ss = Object.keys(rp.s).map(Number); const first = Math.min(...ss);
        const p = mkRealPlayer(rp, y);
        if (first !== y) { p.ask = askingContract(p); S.players[p.id] = p; continue; } // returning veteran: free agent
        p.firstSeason = y;
        // Rookies arrive a little below their first-season level; their real arc does the rest.
        if (S.opts.realCareers) p.r.ovr = Math.max(35, p.r.ovr - 1);
        p.prospect = y; p.born = rp.born; S.players[p.id] = p;
        const viaDraft = rp.dy && rp.dy >= y - 2;
        if (viaDraft) out.push(p.id); else { p.prospect = null; p.ask = askingContract(p); }
      }
    }

      const a = 20 + Math.floor(rnd() * 4);

      const tier = y <= LAST_REAL ? (i < 5 ? 50 : i < 20 ? 45 : 41) : (i < 3 ? 62 : i < 10 ? 55 : i < 25 ? 48 : 43);
      const realEra = y <= LAST_REAL;

  function runDraft() {
    const y = S.season + 1;
    const cls = draftClass(y);
    const R = S.rules.draftRounds;
    if (!R) { finishDraftClass(cls); return; }
    const teams = activeTeams();
    const recOrder = standings().slice().reverse().map((t) => t.fid); // worst first, tiebreakers applied
    const newT = teams.filter((t) => t.expansionYear === y).map((t) => t.fid);
    let base = recOrder.filter((f) => !newT.includes(f));

      picks.push({ pick: i + 1, round: s.round, fid: s.fid, pid: ch.id });

  }
  const lastQualified = () => (S.playoffs ? S.playoffs.qualified : []);
  function finishDraftClass(cls) { cls.map(P).filter((p) => p.prospect).forEach((p) => { p.prospect = null; p.ask = { sal: econ().min, yrs: 1 }; if (!p.real) p.undrafted = true; }); }
  function rookieContract(pick, round) {
    const e = econ();
    if (round === 1) return { sal: Math.round((e.min * 1.9 - ((pick - 1) / 14) * e.min * 0.8) / 1000) * 1000, yrs: 4, rookie: true };

  }
  function contractsAndFreeAgency() {
    // Contracts tick down; expiring players are re-signed or released by their (AI) team.
    for (const p of Object.values(S.players)) {
      if (!p.team || p.retired) continue;
      if (p.draft && p.draft.season === S.season + 1) continue; // just drafted
      p.c.yrs--;
      if (p.c.yrs > 0) continue;
      const fid = p.team, keep = (p.r.ovr >= 58 || (age(p) <= 25 && p.r.pot >= 65)) && age(p) <= 34 && rnd() < 0.72;
      if (keep) { const a = askingContract(p); p.c = { sal: a.sal, yrs: a.yrs }; txn(`${teamName(fid)} re-sign ${p.name}.`, fid, { type: "resign", p: pSnap(p), c: { sal: a.sal, yrs: a.yrs } }); }
      else { txn(`${p.name} leaves the ${teamName(fid)} in free agency.`, fid, { type: "leave", p: pSnap(p) }); p.lastTeam = p.team; p.team = null; p.c = { sal: 0, yrs: 0 }; if (p.r.ovr >= 70) log(`${p.name} becomes a free agent, leaving the ${teamName(fid)}.`, fid, "fa"); }
    }
  }
  function develop() {
    const curve = (a) => a <= 21 ? 3 : a <= 22 ? 2.6 : a <= 23 ? 2.2 : a <= 24 ? 1.6 : a <= 25 ? 1 : a <= 26 ? 0.6 : a <= 27 ? 0.2 : a <= 28 ? 0 : a <= 29 ? -0.6 : a <= 30 ? -1.1 : a <= 31 ? -1.7 : a <= 32 ? -2.4 : a <= 33 ? -3 : -4;
    for (const p of Object.values(S.players)) {
      if (p.retired || p.prospect) continue;
      const old = p.r.ovr;
      const real = S.opts.realCareers && p.real ? realRatings(p.id, S.season) : null;
      if (S.opts.realCareers && p.real && !real && S.season <= LAST_REAL && realSeasons(p.id).some((x) => x > S.season) && age(p) < 33) {
        p.inj = 999; p.injType = "sitting out the season"; // she missed this season in real life
      }

        // Follow the real career: that season's rating, with a little variation.
        const n = Math.round(randn() * 1.5);
        for (const k of ["ovr", ...SKILLS]) p.r[k] = clamp(real[k] + n, 25, 99);
        const peak = realPeakFrom(p.id, S.season);
        p.r.pot = Math.max(p.r.ovr, peak ?? p.r.ovr);
      } else {
        const a = age(p);
        let d = curve(a) + randn() * 2.4;
        if (a <= 26 && p.r.pot > p.r.ovr) d += (p.r.pot - p.r.ovr) * 0.1;
        p.r.ovr = Math.round(clamp(p.r.ovr + d, 30, 99));
        const dd = p.r.ovr - old;
        for (const k of SKILLS) p.r[k] = Math.round(clamp(p.r[k] + dd * (k === "ath" ? (a >= 29 ? 1.5 : 0.8) : 0.6 + rnd() * 0.8) + randn(), 20, 99));
        p.r.pot = a >= 28 ? p.r.ovr : Math.round(clamp(Math.max(p.r.ovr, p.r.pot + randn() * 2), p.r.ovr, 99));
        if (p.potCap) { p.r.pot = Math.min(p.r.pot, p.potCap); p.r.ovr = Math.min(p.r.ovr, p.potCap); }
      }
    }
    updateGenCap();
    for (const p of Object.values(S.players)) if (!p.real && !p.retired) capGen(p);
  }
  // Age-based retirement odds for generated players, and for real players once past the real data.
  function agePr(p, a) {

  function sortRows(rows, key, def) { const s = ui.sort[key] || def; rows.sort((a, b) => { const x = s.get(a), y = s.get(b); return (x < y ? -1 : x > y ? 1 : 0) * (s.dir || -1); }); return rows; }

  // ---------- standings / playoffs ----------
  function renderStandings() {
    const S = GM.S, confs = GM.activeConfs();
    const conf = confs.length > 1;
    const cutConf = S.rules.seeding === "conference" && conf;
    const per = cutConf ? Math.round(S.rules.playoffTeams / confs.length) : S.rules.playoffTeams;
    const table = (title, st, cut) => `<section class="panel"><h2>${esc(title)}</h2><div class="tablewrap"><table><thead><tr><th>#</th><th>Team</th><th class="num">W</th><th class="num">L</th><th class="num">PCT</th><th class="num">GB</th><th class="num">Home</th><th class="num">Away</th><th class="num">PF</th><th class="num">PA</th><th class="num">Diff</th><th class="num">Strk</th><th class="num">Rating</th></tr></thead><tbody>
      ${st.map((t, i) => { const gp = t.w + t.l, gb = ((st[0].w - t.w) + (t.l - st[0].l)) / 2; return `<tr class="${cut && i === cut - 1 && i < st.length - 1 ? "cutline" : ""}"><td class="muted">${i + 1}</td><td>${badge(t.fid)} ${tlink(t.fid)}${st.notes && st.notes[t.fid] ? ` <span class="chip" title="Tied on record; ordered by ${esc(st.notes[t.fid])}">TB: ${esc(st.notes[t.fid])}</span>` : ""}</td><td class="num">${t.w}</td><td class="num">${t.l}</td><td class="num">${gp ? (t.w / gp).toFixed(3).replace(/^0/, "") : "–"}</td><td class="num">${gb ? gb.toFixed(1) : "–"}</td><td class="num">${t.hw}-${t.hl}</td><td class="num">${t.w - t.hw}-${t.l - t.hl}</td><td class="num">${gp ? f1(t.pf / gp) : "–"}</td><td class="num">${gp ? f1(t.pa / gp) : "–"}</td><td class="num">${gp ? f1((t.pf - t.pa) / gp) : "–"}</td><td class="num">${t.streak ? (t.streak > 0 ? "W" + t.streak : "L" + -t.streak) : "–"}</td><td class="num">${GM.teamRating(t.fid).toFixed(1)}</td></tr>`; }).join("")}
      </tbody></table></div></section>`;
    const br = bestReal(S.season);
    $("#view").innerHTML = (conf ? confs.map((c) => table(`${c} · ${S.season}`, GM.standings(c), cutConf ? per : 0)).join("") : "")
      + table(conf ? `League table · ${S.season}` : `Standings · ${S.season}`, GM.standings(), cutConf ? 0 : per)
      + `<div class="sub">The dashed line marks the playoff cut (${cutConf ? `top ${per} per conference` : `top ${per} overall`}). Teams tied on record are separated by head-to-head record among the tied teams, then record against teams at .500 or better, then point differential, then a coin flip; "TB" shows which one decided it.${br ? ` In real life, ${S.season}'s best record belonged to ${esc(br.city)} ${esc(br.name)} at ${br.w}-${br.l}.` : ""}</div>`;
  }
  // ---------- visual bracket ----------
  const BK = { CW: 190, CH: 62, VG: 18, HG: 36, TOP: 34 };
  // Every round of a bracket, with not-yet-played rounds filled in as pending slots.
  function fullRounds(br) {
    const out = [];
    for (let r = 0; r < (br.R || 0); r++) {
      const n = 2 ** (br.R - r - 1), row = [];
      for (let i = 0; i < n; i++) {
        const s = br.rounds[r] && br.rounds[r][i];
        if (s) row.push({ ...s, bye: !s.lo });
        else if (r === 0) {
          // Not seeded yet (e.g. a Finals bracket waiting on conference champions).
          let o = [1]; while (o.length < 2 ** br.R) { const m = o.length * 2 + 1; o = o.flatMap((x) => [x, m - x]); }
          row.push({ hi: br.seeds[o[2 * i] - 1] || null, lo: br.seeds[o[2 * i + 1] - 1] || null, wh: 0, wl: 0, winner: null, pending: true });
        } else { const a = out[r - 1][2 * i], b = out[r - 1][2 * i + 1]; row.push({ hi: a.winner || null, lo: b.winner || null, wh: 0, wl: 0, winner: null, pending: true }); }
      }
      out.push(row);
    }
    return out;
  }
  function bracketChart(po, snap) {
    const { CW, CH, VG, HG, TOP } = BK, unit = CH + VG, col = CW + HG;
    const cards = [], paths = [], labels = [];
    const nm = (fid) => (snap[fid] || GM.T(fid) || { name: fid }).name;
    const row = (br, fid, w, isWin, isLose, showW) => {
      if (!fid) return `<div class="bk-row"><span class="bk-seed"></span><span class="bk-name muted">TBD</span></div>`;
      const seed = br ? br.seeds.indexOf(fid) + 1 : "";
      return `<button class="bk-row ${isWin ? "win" : isLose ? "lose" : ""}" data-act="team" data-id="${fid}"><span class="bk-seed">${seed || ""}</span>${snapBadge(snap, fid)}<span class="bk-name">${esc(nm(fid))}</span><b class="bk-w">${showW ? w : ""}</b></button>`;
    };
    const card = (x, y, m, br) => {
      if (m.bye) { cards.push(`<div class="bk-card bye" style="left:${x}px;top:${y + CH / 4}px;width:${CW}px;height:${CH / 2}px">${row(br, m.hi, 0, false, false, false).replace('<b class="bk-w"></b>', '<span class="chip">Bye</span>')}</div>`); return; }
      const started = (m.wh || 0) + (m.wl || 0) > 0;
      const state = m.winner ? "done" : started ? "live" : m.pending || !m.lo ? "pending" : "";
      cards.push(`<div class="bk-card ${state}" style="left:${x}px;top:${y}px;width:${CW}px;height:${CH}px" title="${m.bestOf ? `Best of ${m.bestOf}` : ""}">${row(br, m.hi, m.wh, m.winner && m.winner === m.hi, m.winner && m.winner !== m.hi, started || m.winner)}${row(br, m.lo, m.wl, m.winner && m.winner === m.lo, m.winner && m.winner !== m.lo, started || m.winner)}</div>`);
    };
    const link = (x1, y1, x2, y2, on) => { const mx = (x1 + x2) / 2; paths.push(`<path class="${on ? "on" : ""}" d="M${x1},${y1} H${mx} V${y2} H${x2}"/>`); };
    const roundName = (br, r, conf) => {
      const fromEnd = br.R - 1 - r + (br.extra || 0);
      if (fromEnd === 0) return "Finals";
      if (fromEnd === 1) return conf ? `${br.label} final` : "Semifinals";
      if (fromEnd === 2 && r > 0) return conf ? `${br.label} semis` : "Quarterfinals";
      return conf ? `${br.label} round ${r + 1}` : r === 0 ? "First round" : `Round ${r + 1}`;
    };
    const boOf = (br, r) => {
      const s = (br.rounds[r] || []).find((x) => x.lo); if (s) return `Best of ${s.bestOf}`;
      const fe = br.R - 1 - r + (br.extra || 0), R = GM.S.rules;
      return `Best of ${fe === 0 ? R.finalsBo : fe === 1 ? R.semisBo : R.earlyBo}`;
    };
    // Draw one bracket; returns the champion slot's position for linking onward.
    function draw(br, x0, y0, H, dir, conf) {
      const R = br.R || 0;
      if (!R) { // single qualifier
        const y = y0 + H / 2 - CH / 4;
        cards.push(`<div class="bk-card bye" style="left:${x0}px;top:${y}px;width:${CW}px;height:${CH / 2}px">${row(br, br.seeds[0], 0, false, false, false)}</div>`);
        return { x: x0, y: y + CH / 4, w: CW, champ: br.seeds[0] };
      }
      const rounds = fullRounds(br), Hb = 2 ** (R - 1) * unit, yb = y0 + (H - Hb) / 2;
      const X = (r) => (dir === "ltr" ? x0 + r * col : x0 + (R - 1 - r) * col);
      const C = (r, i) => yb + (i + 0.5) * 2 ** r * unit;
      rounds.forEach((rd, r) => {
        labels.push(`<div class="bk-label" style="left:${X(r)}px;top:${y0 - TOP}px;width:${CW}px">${esc(roundName(br, r, conf))}<span>${boOf(br, r)}</span></div>`);
        rd.forEach((m, i) => {
          card(X(r), C(r, i) - CH / 2, m, br);
          if (r > 0) for (const k of [2 * i, 2 * i + 1]) {
            const ch = rounds[r - 1][k], cy = C(r - 1, k);
            const fromX = dir === "ltr" ? X(r - 1) + CW : X(r - 1), toX = dir === "ltr" ? X(r) : X(r) + CW;
            link(fromX, cy, toX, C(r, i), !!ch.winner);
          }
        });
      });
      const last = rounds[R - 1][0];
      return { x: X(R - 1), y: C(R - 1, 0), w: CW, champ: last.winner || null };
    }
    let W = 0, H = 0;
    const brs = po.brackets;
    const finalMatch = (champs) => {
      if (po.final) { const fr = fullRounds(po.final); return { m: fr.length ? fr[fr.length - 1][0] : { hi: po.final.champion, bye: true }, br: po.final }; }
      return { m: { hi: champs[0] || null, lo: champs[1] || null, wh: 0, wl: 0, winner: null, pending: true }, br: null };
    };
    const champBox = (x, y, fid) => {
      cards.push(`<div class="bk-champ" style="left:${x}px;top:${y}px;width:${CW}px"><span class="eyebrow">${po.projected ? "Projected bracket" : "Champion"}</span>${fid ? `<div class="row" style="justify-content:center">${!po.projected ? trophy("champion", "sm") : ""}${snapBadge(snap, fid)}<b>${esc(snapName(snap, fid))}</b></div>` : `<span class="muted">To be decided</span>`}</div>`);
    };
    if (brs.length === 2) {
      // Conferences face each other; the Finals sit in the middle.
      const [A, B] = brs, R = Math.max(A.R || 0, B.R || 0);
      H = Math.max(2 ** Math.max(0, (A.R || 1) - 1), 2 ** Math.max(0, (B.R || 1) - 1)) * unit;
      const fx = R * col;
      const a = draw(A, (R - Math.max(1, A.R || 0)) * col, TOP, H, "ltr", true);
      const b = draw(B, fx + CW + HG, TOP, H, "rtl", true);
      const fy = TOP + H / 2;
      const f = finalMatch([A.champion, B.champion]);
      labels.push(`<div class="bk-label" style="left:${fx}px;width:${CW}px">Finals<span>${f.m.bestOf ? `Best of ${f.m.bestOf}` : `Best of ${GM.S.rules.finalsBo}`}</span></div>`);
      card(fx, fy - CH / 2, f.m, f.br);
      link(a.x + a.w, a.y, fx, fy, !!A.champion);
      link(b.x, b.y, fx + CW, fy, !!B.champion);
      champBox(fx, fy + CH / 2 + 18, po.champion);
      W = fx + CW + HG + Math.max(1, B.R || 0) * col - HG;
      H = Math.max(H, H / 2 + CH / 2 + 120);
    } else if (brs.length === 1) {
      const A = brs[0], R = A.R || 0;
      H = Math.max(1, 2 ** Math.max(0, R - 1)) * unit;
      const a = draw(A, 0, TOP, H, "ltr", false);
      const cx = a.x + CW + HG;
      link(a.x + a.w, a.y, cx, a.y, !!A.champion);
      champBox(cx, a.y - 30, po.champion);
      W = cx + CW; H = Math.max(H, a.y - TOP + 90);
    } else {
      // Three or more conferences: each conference bracket, then the Finals bracket.
      let y = TOP, maxW = 0;
      for (const br of brs) {
        const h = Math.max(1, 2 ** Math.max(0, (br.R || 1) - 1)) * unit;
        const a = draw(br, 0, y, h, "ltr", true);
        maxW = Math.max(maxW, a.x + CW);
        y += h + TOP + 10;
      }
      const champs = brs.map((b) => b.champion).filter(Boolean);
      const fb = po.final || { label: "Finals", seeds: champs, R: Math.ceil(Math.log2(Math.max(2, brs.length))), rounds: [], extra: 0 };
      const fbx = maxW + HG * 2;
      const hf = Math.max(1, 2 ** Math.max(0, (fb.R || 1) - 1)) * unit;
      const fRes = draw(fb, fbx, TOP + (y - TOP - hf) / 2, hf, "ltr", false);
      champBox(fRes.x + CW + HG, fRes.y - 30, po.champion);
      W = fRes.x + 2 * CW + HG; H = y;
    }
    return `<div class="bk-wrap"><div class="bk" style="width:${W}px;height:${H + TOP + 10}px">
      <svg width="${W}" height="${H + TOP + 10}" aria-hidden="true">${paths.join("")}</svg>${labels.join("")}${cards.join("")}</div></div>`;
  }

  function renderPlayoffs() {

  // Calendar date of a game on a real schedule ("Sat, May 21"); null when generated.
  function gameDate(sg, off, withYear) {
    if (!sg.info || !sg.info.real || off == null) return null;
    const d = new Date(sg.info.start + "T12:00:00"); d.setDate(d.getDate() + off);
    return d.toLocaleDateString(undefined, withYear ? { weekday: "short", month: "short", day: "numeric", year: "numeric" } : { weekday: "short", month: "short", day: "numeric" });
  }
  function gameRow(sg, g, perspective) {

    if (perspective) {

  // One playoff series: header, the two teams, then each game on its own line.
  function seriesCard(sg, s) {

        <div class="scoreline"><span>${snapBadge(snap, b.away, true)} ${esc(snap[b.away]?.name || b.away)} <b class="${b.as > b.hs ? "" : "muted"}">${b.as}</b></span><span class="muted">@</span><span><b class="${b.hs > b.as ? "" : "muted"}">${b.hs}</b> ${esc(snap[b.home]?.name || b.home)} ${snapBadge(snap, b.home, true)}</span>${b.ot ? `<span class="chip">${b.ot > 1 ? b.ot : ""}OT</span>` : ""}</div>
        <div class="sub">at ${esc(snapName(snap, b.home))}</div></div><button class="btn" data-act="closeModal">Close</button></div>

        ${card("Team points (most)", rb.teamGame.high, (e) => `<td>${esc(e.abbr)} <span class="muted">vs ${esc(e.opp)}</span></td><td class="muted">${e.season}${e.po ? " PO" : ""}</td><td class="num rv">${e.v}</td>`)}
        ${card("Team points (fewest)", rb.teamGame.low, (e) => `<td>${esc(e.abbr)} <span class="muted">vs ${esc(e.opp)}</span></td><td class="muted">${e.season}${e.po ? " PO" : ""}</td><td class="num rv">${e.v}</td>`)}
        ${card("Largest margin", rb.teamGame.margin, (e) => `<td>${esc(e.abbr)} <span class="muted">${esc(e.score)} vs ${esc(e.opp)}</span></td><td class="muted">${e.season}${e.po ? " PO" : ""}</td><td class="num rv">+${e.v}</td>`)}</div>`;
    } else if (view === "season") {
      body = `<div class="sub">Per-game averages in a season (at least half the season's games). Includes real seasons before ${S.startYear}.</div>
        <div class="rec-grid">${["pts", "reb", "ast", "stl", "blk"].map((k) => card(`${STAT[k]} per game`, rb.season[k], (e) => `<td class="rec-who">${pname(e)}<span class="sub">${esc(e.team)}</span></td><td class="muted rec-when">${e.season}${e.real ? `<span class="sub">real</span>` : ""}</td><td class="num rv">${(+e[k]).toFixed(1)}</td>`)).join("")}</div>`;
    } else if (view === "career") {
      body = `<div class="sub">Career totals across real seasons before ${S.startYear} and every season played in your league. Pre-${S.startYear} totals are rebuilt from per-game averages, so they can be off by a few.</div>
        <div class="rec-grid">${["pts", "reb", "ast", "stl", "blk", "gp"].map((k) => card(STAT[k], rb.career[k], (e) => `<td class="rec-who">${pname(e)}<span class="sub">${e.first}–${e.last}</span></td><td class="num rv">${e[k].toLocaleString()}</td>`)).join("")}</div>`;
    } else {
      const tl = (e) => `<td>${esc(e.name)}</td><td class="muted">${e.season}${e.real ? " ·real" : ""}</td><td class="num rv">${e.w}-${e.l}</td>`;
      body = `<div class="rec-grid">${card("Best records", rb.bestTeams, tl)}${card("Worst records", rb.worstTeams, tl)}
        ${card("Longest winning streaks", rb.streaks, (e) => `<td>${esc(e.name)}</td><td class="muted">${e.season}</td><td class="num rv">${e.streak}</td>`)}
        ${card(`Championships since ${S.startYear}`, rb.titles, (e) => `<td>${badge(e.fid)} ${esc(e.name)}${e.active ? "" : ' <span class="chip">defunct</span>'}</td><td></td><td class="num rv">${e.titles}</td>`)}</div>`;
    }
    $("#view").innerHTML = `<div class="seg">${[["game", "Single game"], ["season", "Season"], ["career", "Career"], ["team", "Team"]].map(([k, l]) => `<button class="${view === k ? "on" : ""}" data-act="recView" data-v="${k}">${l}</button>`).join("")}</div>${body}`;
  }
  function renderSettings() {
    const S = GM.S;
    $("#view").innerHTML = `<div class="grid2">
      <section class="panel"><h2>Save</h2>
        <div class="prose"><p>The league saves in this browser after every step. To move it to another device or keep a backup, copy the save code${window.top === window ? " or download it" : ""}, then import it later.</p></div>
        ${GM.saveError ? `<div class="chip bad">${esc(GM.saveError)}</div>` : ""}
        <div class="row"><button class="btn" data-act="copySave">Copy save code</button>${window.top === window ? `<button class="btn" data-act="downloadSave">Download save file</button>` : ""}</div>
        <label class="sub" for="importText">Import: paste a save code here, or choose a file</label>
        <textarea id="importText" placeholder="Paste save code"></textarea>
        <div class="row"><button class="btn" data-act="importText">Load pasted save</button><input type="file" id="importFile" accept=".json,application/json" aria-label="Import save file"></div>
        <div class="row">${ui.confirm === "new" ? `<span>This replaces your current league.</span><button class="btn danger" data-act="newGame">Start over</button><button class="btn" data-act="cancel">Keep going</button>` : `<button class="btn danger" data-act="askNew">New league</button>`}</div>
      </section>
      <section class="panel"><h2>How it works</h2><div class="prose">
        <p><b>Data.</b> Every season from ${D.first} to ${D.last} comes from <a href="https://github.com/sportsdataverse/wehoop-wnba-stats-data" target="_blank" rel="noopener">sportsdataverse/wehoop-wnba-stats-data</a> (CC BY 4.0): teams, conferences, records, player bios and season stats.</p>
        <p><b>Ratings.</b> A player's rating for a season uses her whole career up to that point. Each season is graded against that year's league, then averaged by minutes, with each year back counting ${Math.round(D.decay * 100)}% as much as the one after it.</p>
        <p><b>Real careers.</b> With real career arcs on, each season a player's rating follows how she actually played that year. After ${D.last}, or in seasons she didn't play, the sim develops her normally. Real players enter the draft in their real draft years; generated prospects fill the remaining picks and every class after ${D.last}.</p>
        <p><b>Teams.</b> The sim runs every front office: contenders trade youth for veterans, rebuilders do the reverse, and every team drafts, re-signs and signs free agents under your cap.</p>
        <p><b>Money.</b> The data has no salaries. Caps before 2026 are rough estimates, and salaries scale with the cap you set.</p>
        <p class="muted">Courtside is a fan-made simulator and is not affiliated with or endorsed by the WNBA, its teams or its players.</p>
      </div></section></div>${logoPanel()}${trophyPanel()}`;
  }

  // ---------- render ----------
  function render() {
    renderTop();
    if (!GM.S) { renderSetup(); $("#modal").innerHTML = ""; return; }
    const views = { awards: renderAwards, records: renderRecords, office: renderOffice, schedule: renderSchedule, standings: renderStandings, playoffs: renderPlayoffs, teams: renderTeams, players: renderPlayers, leaders: renderLeaders, draft: renderDraft, moves: renderMoves, history: renderHistory, league: renderLeague, settings: renderSettings };
    (views[ui.tab] || renderOffice)();
    const m = ui.modal;
    $("#modal").innerHTML = !m ? "" : m.type === "player" ? playerModal(m.id) : m.type === "box" ? boxModal(m.season, m.id) : teamModal(m.id);
  }
  const val = (id) => $("#" + id)?.value;
  const numv = (id) => +val(id);

  function act(a, el) {
    const S = GM.S, id = el.dataset.id;
    switch (a) {
      case "tab": if (el.dataset.tab === "playoffs") ui.poSeason = GM.S.season; ui.tab = el.dataset.tab; ui.modal = null; ui.confirm = null; window.scrollTo(0, 0); if (el.dataset.scroll) { const id = el.dataset.scroll; setTimeout(() => document.getElementById(id)?.scrollIntoView({ behavior: "smooth", block: "start" }), 60); } break;
      case "newLeague": GM.newLeague(ui.setup.year, { realCareers: $("#optReal").checked, followHistory: $("#optHist").checked }); ui.tab = "office"; window.scrollTo(0, 0); toast(`Welcome, Commissioner. The ${ui.setup.year} season awaits.`); break;
      case "player": ui.modal = { type: "player", id: +id }; break;
      case "box": ui.modal = { type: "box", season: +el.dataset.season, id: el.dataset.gid }; break;
      case "schedView": ui.sched.view = el.dataset.v; break;
      case "awardsView": ui.awardsView = el.dataset.v; break;
      case "txType": ui.tx.type = el.dataset.v; ui.tx.limit = 120; break;
      case "txMore": ui.tx.limit += 150; break;
      case "recView": ui.recView = el.dataset.v; break;
      case "poGames": ui.sched = { season: ui.poSeason, team: "all", view: "playoffs" }; ui.tab = "schedule"; window.scrollTo(0, 0); break;
      case "teamSched": ui.sched = { season: GM.S.season, team: id, view: "regular" }; ui.tab = "schedule"; ui.modal = null; window.scrollTo(0, 0); break;
      case "clearLogo": delete logos[el.dataset.key]; saveLogos(); toast("Logo removed."); break;
      case "team": ui.modal = { type: "team", id }; ui.confirm = null; break;
      case "closeModal": ui.modal = null; ui.confirm = null; break;
      case "sort": { const k = el.dataset.key, c = el.dataset.col, cur = ui.sort[k]; ui.sort[k] = { col: c, dir: cur && cur.col === c ? -cur.dir : -1, get: getters[c] }; break; }
      case "startSeason": { const r = GM.startSeason(); if (!r.ok) toast(r.msg || "Can't start yet.", true); break; }
      case "sim": GM.simDays(+el.dataset.n); if (GM.S.phase === "playoffs") toast("Regular season complete. The playoffs are set."); break;
      case "po": GM.simPlayoffs(el.dataset.mode); break;
      case "toOffseason": GM.toOffseason(); ui.tab = "office"; break;
      case "advance": { const r = GM.advanceToNextSeason(); if (r.ok) { ui.tab = "office"; toast(`${GM.S.season} preseason. The draft, free agency and player development are done.`); } break; }
      case "event": GM.setEventApproval(id, el.dataset.ok === "1"); break;
      case "saveRules":
        GM.setRules({ playoffTeams: numv("rPlayoffTeams"), seeding: val("rSeeding"), earlyBo: numv("rEarly"), semisBo: numv("rSemis"), finalsBo: numv("rFinals"),
          games: numv("rGames"), cap: numv("rCap") * 1000, capGrowth: numv("rGrowth") / 100, maxPct: numv("rMaxPct") / 100, rosterMin: numv("rRosterMin"), rosterMax: numv("rRosterMax"),
          draftRounds: numv("rRounds"), lotteryTeams: numv("rLotTeams"), lotteryPicks: numv("rLotPicks"), expansionProtect: numv("rProtect"), tradeDeadline: numv("rDeadline") / 100 });
        toast(GM.officeOpen() ? "Rules updated." : "Rules queued for next season."); break;
      case "addConf": { const r = GM.addConference(val("newConf")); toast(r.ok ? "Conference added." : r.msg, !r.ok); break; }
      case "renameConf": { const i = +el.dataset.i; const r = GM.renameConference(S.conferences[i], val("cn-" + i)); toast(r.ok ? "Conference renamed." : r.msg, !r.ok); break; }
      case "removeConf": { const r = GM.removeConference(S.conferences[+el.dataset.i]); toast(r.ok ? "Conference dissolved; its teams moved to the smallest conference." : r.msg, !r.ok); break; }
      case "expand": { const r = GM.expandTeam({ city: val("xCity").trim(), name: val("xName").trim(), abbr: val("xAbbr"), color: val("xColor"), conf: val("xConf") }); toast(r.ok ? "Expansion approved. The expansion draft is done." : r.msg, !r.ok); break; }
      case "relocate": { const r = GM.relocateTeam(id, { city: val("relCity").trim(), name: val("relName").trim(), abbr: val("relAbbr"), color: val("relColor") }); toast(r.ok ? "Franchise updated." : r.msg, !r.ok); break; }
      case "askFold": ui.confirm = "fold" + id; break;
      case "fold": { const r = GM.foldTeam(id); ui.confirm = null; toast(r.ok ? "Franchise folded. The dispersal draft is done." : r.msg, !r.ok); break; }
      case "cancel": ui.confirm = null; break;
      case "leaders": ui.leaders = el.dataset.c; break;
      case "copySave": { const txt = JSON.stringify({ ...S, _logos: logos }); navigator.clipboard.writeText(txt).then(() => toast("Save code copied."), () => { $("#importText").value = txt; $("#importText").select(); toast("Copy was blocked: the code is selected in the box. Copy it manually.", true); }); return; }
      case "downloadSave": { const a2 = document.createElement("a"); a2.href = URL.createObjectURL(new Blob([JSON.stringify({ ...S, _logos: logos })], { type: "application/json" })); a2.download = `courtside-${S.startYear}-${S.season}.json`; a2.click(); return; }
      case "importText": try { const o = JSON.parse(val("importText")); if (!o.teams || !o.players || !o.rules) throw 0; if (o._logos) { logos = o._logos; saveLogos(); } delete o._logos; GM.importState(o); ui.tab = "office"; toast("League loaded."); } catch (e) { toast("That isn't a Courtside save code.", true); return; } break;
      case "askNew": ui.confirm = "new"; break;
      case "newGame": ui.confirm = null; GM.clearSave(); break;
      default: return;
    }
    render();
  }
  document.addEventListener("click", (e) => {
    const el = e.target.closest("[data-act]"); if (!el) return;
    const a = el.dataset.act;
    if (a === "closeModal" && el.classList.contains("modal-bg") && e.target !== el) return;
    if (["teamConf", "setupYear"].includes(a)) return;
    act(a, el);
  });
  document.addEventListener("change", (e) => {
    const el = e.target, a = el.dataset && el.dataset.act;
    if (a === "teamConf") { GM.setTeamConf(el.dataset.id, el.value); render(); }
    else if (a === "setupYear" || el.id === "setupRange") { ui.setup.year = +el.value; render(); }
    else if (el.id === "optReal") ui.setup.realCareers = el.checked;
    else if (el.id === "optHist") ui.setup.followHistory = el.checked;
    else if (el.id === "optHistory") { GM.S.opts.followHistory = el.checked; GM.save(); render(); }
    else if (el.id === "optSched") { GM.S.opts.realSchedule = el.checked; GM.save(); render(); }
    else if (el.id === "optCareers") { GM.S.opts.realCareers = el.checked; GM.save(); }
    else if (el.id === "newsKind") { ui.newsKind = el.value; render(); }
    else if (el.id === "pteam") { ui.players.team = el.value; render(); }
    else if (el.id === "txTeam") { ui.tx.team = el.value; ui.tx.limit = 120; render(); }
    else if (el.id === "txSeason") { ui.tx.season = el.value; ui.tx.limit = 120; render(); }
    else if (el.id === "poSeason") { ui.poSeason = +el.value; render(); }
    else if (el.id === "schedSeason") { ui.sched.season = +el.value; render(); }
    else if (el.id === "schedTeam") { ui.sched.team = el.value; render(); }
    else if (el.dataset && el.dataset.logo && el.files && el.files[0]) {
      const key = el.dataset.logo;
      const isTrophy = key.startsWith("tr:");
      readLogo(el.files[0], (url) => {
        if (!url) { toast("That file couldn't be read as an image.", true); return; }
        logos[key] = url;
        saveLogos().then((ok) => {
          if (!ok) { delete logos[key]; toast("This browser wouldn't save the image. Try a smaller image, or check that site storage is allowed.", true); render(); return; }
          toast(isTrophy ? "Trophy saved in this browser." : "Logo saved in this browser."); render();
        });
      }, isTrophy ? 320 : 160);
    }
    else if (el.id === "importFile" && el.files[0]) { const r = new FileReader(); r.onload = () => { try { const o = JSON.parse(r.result); if (!o.rules) throw 0; if (o._logos) { logos = o._logos; saveLogos(); } delete o._logos; GM.importState(o); ui.tab = "office"; toast("League loaded."); render(); } catch (err) { toast("That file isn't a Courtside save.", true); } }; r.readAsText(el.files[0]); }
  });
  document.addEventListener("input", (e) => {
    if (e.target.id === "setupRange") { const s = $("#setupYear"); if (s) s.value = e.target.value; }
    if (e.target.id === "pq") { clearTimeout(ui.qT); const v = e.target.value; ui.qT = setTimeout(() => { ui.players.q = v; render(); const el = $("#pq"); if (el) { el.focus(); el.setSelectionRange(v.length, v.length); } }, 200); }
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && ui.modal) { ui.modal = null; render(); } });

  $("#view").innerHTML = `<div class="empty">Loading your league…</div>`;
  GM.init().then(loadLogos).then(render, () => render());
})();

</script>
</body>
</html>
